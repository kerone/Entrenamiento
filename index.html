<!doctype html>
<meta charset="utf-8">
<title>Entrenamiento</title>
<script>try{var _t=localStorage.getItem('plan-hipertrofia-theme');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entrenamiento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --ink:#1a2429; --mut:#5c6b73;
  --accent:#1f4e5f; --accent-ink:#ffffff; --line:#d5dde1;
  --ok:#2e7d4f; --ok-bg:#e2f2e8; --warn:#8a6d3b; --warn-bg:#f6efdf;
  --bad:#a84848; --bad-bg:#f4e3e3; --info:#2c6e8f; --info-bg:#e3eef4;
  --ok-ink:#ffffff;
  --input:#fbfdfe; --chip:#e7f0f4; --grey:#c9d2d8;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10181c; --surface:#1a252c; --surface2:#141e23; --ink:#e8eef1; --mut:#93a4ad;
  --accent:#4fa3b8; --accent-ink:#0c1418; --line:#2a3840;
  --ok:#6fbf8f; --ok-bg:#1c3226; --warn:#d4b578; --warn-bg:#32291a;
  --bad:#d98383; --bad-bg:#3a2222; --info:#7cc0d8; --info-bg:#1d3742;
  --ok-ink:#0c1418;
  --input:#0e161a; --chip:#22333c; --grey:#3a4a53;
}}
:root[data-theme="dark"]{
  --bg:#10181c; --surface:#1a252c; --surface2:#141e23; --ink:#e8eef1; --mut:#93a4ad;
  --accent:#4fa3b8; --accent-ink:#0c1418; --line:#2a3840;
  --ok:#6fbf8f; --ok-bg:#1c3226; --warn:#d4b578; --warn-bg:#32291a;
  --bad:#d98383; --bad-bg:#3a2222; --info:#7cc0d8; --info-bg:#1d3742;
  --ok-ink:#0c1418;
  --input:#0e161a; --chip:#22333c; --grey:#3a4a53;
}
:root[data-theme="light"]{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --ink:#1a2429; --mut:#5c6b73;
  --accent:#1f4e5f; --accent-ink:#ffffff; --line:#d5dde1;
  --ok:#2e7d4f; --ok-bg:#e2f2e8; --warn:#8a6d3b; --warn-bg:#f6efdf;
  --bad:#a84848; --bad-bg:#f4e3e3; --info:#2c6e8f; --info-bg:#e3eef4;
  --ok-ink:#ffffff;
  --input:#fbfdfe; --chip:#e7f0f4; --grey:#c9d2d8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
header{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:12px 56px 8px 14px; border-bottom:1px solid var(--line); position:sticky;
}
#themebtn{
  position:absolute; top:10px; right:12px; width:38px; height:38px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface); color:var(--mut);
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
}
#themebtn svg{width:18px; height:18px}
h1{font-size:17px; margin:0 0 2px; letter-spacing:.2px}
.sub{font-size:12px; color:var(--mut)}
.weekbar{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:10px 0 7px}
.wcell{
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px;
  padding:6px 2px 5px; font:inherit; cursor:pointer; text-align:center; min-width:0;
}
.wcell .wk-n{display:block; font-size:15px; font-weight:800; line-height:1.15}
.wcell .wk-d{display:block; font-size:9.5px; color:var(--mut); white-space:nowrap; overflow:hidden}
.wcell.done .wk-n::after{content:'✓'; font-size:10px; color:var(--ok); margin-left:2px}
.wcell.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.wcell.sel .wk-d{color:var(--accent-ink); opacity:.85}
.wcell.sel.done .wk-n::after{color:var(--accent-ink)}
.wcell.today:not(.sel){border-color:var(--accent)}
.wcell.c2{border-style:dashed}
.wcell.c2.sel{border-style:solid}
main{padding:12px 12px 24px; max-width:640px; margin:0 auto}
/* ---- portada: tarjetas de día ---- */
.daycard{
  display:block; width:100%; text-align:left; font:inherit; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px; margin:0 0 12px; cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.07);
}
.daycard.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, 0 1px 3px rgba(0,0,0,.07)}
.daycard.full{background:var(--ok-bg); border-color:var(--ok)}
.daycard.full .dc-day, .daycard.full .dc-title{color:var(--ok)}
.daycard.full .dc-state{background:var(--ok); color:var(--ok-ink)}
.daycard.full .dc-prog{display:none}
.daycard.full .chip{background:transparent; border-color:var(--ok); color:var(--ok)}
.daycard.rest{cursor:default; background:var(--surface2); box-shadow:none}
.chip{display:inline-block; background:var(--surface2); border:1px solid var(--line); color:var(--mut); border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600; white-space:nowrap}
.chip.sm{padding:2px 8px; font-size:11px}
.dc-top{display:flex; align-items:center; gap:8px}
.dc-day{font-size:11px; font-weight:800; letter-spacing:.8px; color:var(--mut)}
.dc-today{background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:2px 8px; font-size:10px; font-weight:800; letter-spacing:.5px}
.dc-state{margin-left:auto; font-size:12px; font-weight:700; border-radius:999px; padding:4px 10px; background:var(--chip); color:var(--accent); white-space:nowrap}
.dc-state.ok{background:var(--ok-bg); color:var(--ok)}
.dc-state.part{background:var(--info-bg); color:var(--info)}
.dc-state.mut{background:var(--surface2); color:var(--mut); font-weight:500}
.dc-title{font-size:16px; font-weight:700; margin-top:3px}
.dc-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.dc-prog{height:5px; background:var(--surface2); border-radius:99px; margin-top:10px; overflow:hidden}
.dc-prog.day{margin:10px 0 14px; background:var(--surface)}
.dc-prog i{display:block; height:100%; background:var(--ok); border-radius:99px}
.dc-det{margin-top:6px; font-size:12px; color:var(--mut)}
.dc-det summary{cursor:pointer; font-weight:700}
.howto{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 14px; font-size:12.5px; color:var(--mut)}
.howto summary{cursor:pointer; font-weight:700; color:var(--ink); font-size:13px}
.syncrow{display:flex; gap:8px; flex-wrap:wrap}
.syncrow label{flex:1 1 140px; font-size:12px; color:var(--mut)}
.syncrow input{width:100%; height:40px; font-size:13px; padding:0 8px; background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px; box-sizing:border-box}
.syncrow input:focus{outline:2px solid var(--accent); outline-offset:-1px}
/* ---- vista de día: sesión guiada ---- */
.daybar{display:flex; align-items:center; gap:10px; margin:2px 0 6px}
.backbtn{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; flex:0 0 auto}
.dbt{min-width:0}
.dbt b{display:block; font-size:15px}
.dbt span{font-size:12px; color:var(--mut)}
.excard{background:var(--surface); border:1px solid var(--line); border-radius:12px}
.pagecard{padding:12px}
.pghead{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.pgname{font-size:15.5px; font-weight:700; line-height:1.25}
.pgsub{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
.stx{flex:0 0 36px; height:36px; border-radius:999px; background:var(--surface2); color:var(--mut); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums}
.stx.part{background:var(--info-bg); color:var(--info)}
.stx.done{background:var(--ok); color:var(--ok-ink); font-size:15px}
.pager{display:flex; align-items:flex-start; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:0 -12px}
.pager::-webkit-scrollbar{display:none}
.expage{flex:0 0 100%; min-width:0; scroll-snap-align:start; scroll-snap-stop:always; padding:0 12px 4px; box-sizing:border-box}
.pagerdots{display:flex; gap:6px; margin:0 0 10px; flex-wrap:wrap}
.pd{width:30px; height:30px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--mut); font-size:12px; font-weight:800; cursor:pointer; font-variant-numeric:tabular-nums}
.pd.done{background:var(--ok); border-color:var(--ok); color:var(--ok-ink)}
.pd.cur{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); color:var(--accent)}
.pd.done.cur{color:var(--ok-ink)}
.exchart{margin-top:12px; border-top:1px solid var(--line); padding-top:8px}
.exchart-t{font-size:12.5px; font-weight:700; margin-bottom:4px}
.exchart svg{width:100%; height:auto; display:block}
.calpanel{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px}
.ckbtn{flex:0 0 46px; width:46px; height:42px; border-radius:8px; border:1px solid var(--line); background:var(--input); color:var(--mut); font-weight:800; font-size:16px; cursor:pointer; padding:0}
.ckbtn.eF{background:var(--info-bg); color:var(--info); border-color:var(--info)}
.ckbtn.eE{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.ckbtn.eL{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
.ckbtn.eX{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
#effmodal{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center}
#effmodal .fm{background:var(--surface); border:1px solid var(--line); border-radius:16px 16px 0 0; padding:16px 14px calc(16px + env(safe-area-inset-bottom)); width:100%; max-width:480px}
#effmodal h3{margin:0 0 4px; font-size:14.5px}
.effopt{display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--input); color:var(--ink); font:inherit; cursor:pointer; margin-top:8px}
.effopt b{flex:0 0 32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px}
.effopt span{font-size:13px; flex:1; line-height:1.3}
.effopt.sF b{background:var(--info-bg); color:var(--info)}
.effopt.sE b{background:var(--ok-bg); color:var(--ok)}
.effopt.sL b{background:var(--warn-bg); color:var(--warn)}
.effopt.sX b{background:var(--bad-bg); color:var(--bad)}
.effopt.on{outline:2px solid var(--accent); outline-offset:-1px}
#finmodal{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:20px}
#finmodal .fm{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 16px; max-width:340px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,.35)}
#finmodal h3{margin:0 0 6px; font-size:16px}
#finmodal .btns{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
#finmodal .btns .btn{flex:1 1 auto}
.ex{border-bottom:1px solid var(--line); padding:10px 0 12px}
.ex:last-child{border-bottom:0}
.exrow{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.exname{font-weight:600; font-size:14px; flex:1 1 200px}
.exmeta{font-size:12px; color:var(--mut); margin-top:2px}
.wchipbig{
  background:var(--chip); border:1px dashed var(--line); border-radius:8px;
  padding:4px 10px; font-weight:700; font-variant-numeric:tabular-nums; font-size:15px;
  cursor:pointer; white-space:nowrap;
}
.wchipbig.over{border-style:solid; border-color:var(--accent)}
.sets{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center}
.sets input{
  width:52px; height:44px; text-align:center; font-size:17px; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink);
  background:var(--input); border:1px solid var(--line); border-radius:8px;
}
.sets input.extra{border-style:dashed; opacity:.85}
.sets input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.setrow{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:nowrap}
.setrow.extra .setlbl{opacity:.65}
.setrow.extra input{border-style:dashed}
.setlbl{
  flex:1 1 auto; min-width:0; line-height:1.3;
  font-size:12.5px; color:var(--mut); font-variant-numeric:tabular-nums; font-weight:600;
}
.setlbl .prv{white-space:nowrap}
.setlbl .tgt{color:var(--accent)}
.setlbl .prv{color:var(--mut); font-weight:600; font-size:11px}
.setrow input{
  flex:0 0 54px; width:54px; height:42px; text-align:center; font-size:16px; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink);
  background:var(--input); border:1px solid var(--line); border-radius:8px;
}
.setrow input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.eff{display:flex; gap:3px; flex:0 0 auto}
.eff button{
  width:34px; height:42px; border-radius:8px; border:1px solid var(--line);
  background:var(--input); color:var(--mut); font-weight:800; font-size:13px; cursor:pointer; padding:0;
}
.eff .sF.on{background:var(--info-bg); color:var(--info); border-color:var(--info)}
.eff .sE.on{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.eff .sL.on{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
.eff .sX.on{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.adj{font-size:12.5px; font-weight:700; border-radius:8px; padding:5px 10px; margin-top:6px; display:inline-block}
.adj.up{background:var(--info-bg); color:var(--info)}
.adj.down{background:var(--bad-bg); color:var(--bad)}
.pill.down{background:var(--bad-bg); color:var(--bad)}
.pill{
  margin-left:auto; font-size:12px; font-weight:700; border-radius:999px; padding:5px 11px;
  white-space:nowrap;
}
.pill.up{background:var(--ok-bg); color:var(--ok)}
.pill.rep{background:var(--warn-bg); color:var(--warn)}
.pill.none{background:var(--surface2); color:var(--mut); font-weight:500}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  display:flex; align-items:stretch; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:0; color:var(--mut); font:inherit; font-size:11px; font-weight:600;
  letter-spacing:.2px; padding:9px 0 10px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .nic{width:23px; height:23px}
nav button.sel{color:var(--accent); font-weight:700}
#nav-today{
  flex:0 0 auto; width:56px; height:56px; padding:0; border-radius:50%;
  align-self:center; margin:-22px 4px 6px;
  background:linear-gradient(135deg,#2a6478,#16394a);
  border:3px solid var(--bg); box-shadow:0 3px 10px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center;
}
#nav-today svg{width:32px; height:32px}
#nav-today:active{transform:scale(.96)}
table{border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line); padding:6px 7px; text-align:center}
th{background:var(--surface2); font-size:12px}
td.exn{text-align:left; font-size:12.5px}
.tablewrap{overflow-x:auto; border-radius:8px}
.cfgex{border-bottom:1px solid var(--line); padding:10px 0}
.cfgex:last-child{border-bottom:0}
.cfgrow{display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap}
.cfgrow label{font-size:12px; color:var(--mut)}
.cfgrow input{
  width:74px; height:40px; text-align:center; font-size:16px; font-weight:600;
  background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px;
  font-variant-numeric:tabular-nums;
}
.cfgrow input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.tile{
  position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.07);
}
.tile .ti{
  position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:999px;
  background:var(--surface2); color:var(--mut); display:flex; align-items:center; justify-content:center;
}
.tile .ti svg{width:16px; height:16px}
.tile .tv{font-size:24px; font-weight:800; margin-top:2px; line-height:1.1; padding-right:34px}
.tile .tv small{font-size:12px; font-weight:600; color:var(--mut)}
.tile .tl{font-size:12px; color:var(--mut); margin-top:3px}
.tile .td{font-size:11px; font-weight:600; margin-top:2px}
.tile .td.up{color:var(--ok)} .tile .td.dn{color:var(--bad)} .tile .td.neu{color:var(--mut)}
.gbar{display:flex; align-items:center; gap:8px; margin-top:7px}
.glbl{flex:0 0 90px; font-size:12px; color:var(--mut); text-align:right}
.gtrack{flex:1; display:flex; align-items:center; gap:6px}
.gfill{height:14px; background:var(--accent); border-radius:0 4px 4px 0; min-width:2px}
.gval{font-size:12px; font-weight:700; font-variant-numeric:tabular-nums}
.gdays{font-size:11px; color:var(--mut); margin:1px 0 6px 98px; font-variant-numeric:tabular-nums}
.effrow{display:flex; align-items:center; gap:8px; margin-top:7px}
.efflbl{flex:0 0 22px; font-size:12px; color:var(--mut); font-weight:700}
.effbar{flex:1; display:flex; gap:2px; height:20px; border-radius:5px; overflow:hidden}
.effseg{display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; color:var(--accent-ink)}
.effseg.F{background:var(--info)} .effseg.E{background:var(--ok)}
.effseg.L{background:var(--warn)} .effseg.X{background:var(--bad)}
.lgd{display:flex; gap:12px; flex-wrap:wrap; margin-top:9px; font-size:11px; color:var(--mut)}
.lgd i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px}
.pxchart .exchart{border-top:0; padding-top:0; margin-top:2px}
.pxchart .exchart-t{display:none}
#pxq{
  width:100%; height:42px; margin-top:12px; padding:0 12px; font-size:14px;
  background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:10px;
  box-sizing:border-box; -webkit-appearance:none;
}
#pxq:focus{outline:2px solid var(--accent); outline-offset:-1px}
.pxgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.pxcard{
  text-align:left; font:inherit; background:var(--surface2); border:1px solid var(--line);
  border-radius:12px; padding:10px 11px; cursor:pointer; color:var(--ink); min-width:0;
}
.pxcard.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; background:var(--surface)}
.px-name{
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  font-size:11.5px; color:var(--mut); font-weight:600; line-height:1.25; min-height:2.5em;
}
.px-val{display:block; font-size:17px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums}
.px-delta{display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px; margin-top:5px}
.px-delta.up{background:var(--ok-bg); color:var(--ok)}
.px-delta.dn{background:var(--bad-bg); color:var(--bad)}
.px-delta.neu{background:var(--surface); color:var(--mut); border:1px solid var(--line)}
.wk-mini{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
.wk-mini button{border:1px solid var(--line); background:var(--input); color:var(--mut); border-radius:7px; padding:4px 9px; font-size:12px; font-weight:700; cursor:pointer}
.wk-mini button.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.chartwrap svg{width:100%; height:auto; display:block}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:14px}
.card h2{font-size:14px; margin:0 0 8px}
.hint{font-size:12.5px; color:var(--mut); margin:6px 0}
.btn{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px;
  padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer;
}
.btn.ghost{background:var(--surface2); color:var(--ink)}
textarea{
  width:100%; min-height:70px; background:var(--input); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; font-size:11px; padding:8px;
}
.rampa{color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.4px}
.checkin{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:2px 14px; margin:0 0 12px; box-shadow:0 1px 3px rgba(0,0,0,.07);
}
.ci-row{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.ci-row:last-child{border-bottom:0}
.ci-lbl{flex:1 1 130px; min-width:0}
.ci-lbl b{display:block; font-size:13.5px}
.ci-lbl span{display:block; font-size:11.5px; color:var(--mut); margin-top:1px}
.ci-row input{
  width:76px; height:42px; text-align:center; font-size:16px; font-weight:700;
  background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:10px;
  font-variant-numeric:tabular-nums; flex:0 0 auto;
}
.ci-row input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.cbtns{display:flex; gap:5px; flex:0 0 auto}
.cbtns button{width:42px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--input); color:var(--mut); font-weight:800; cursor:pointer}
.cbtns button.ok.on{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.cbtns button.bad.on{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.chip.okc{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.chip.warnc{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.setbtns{display:inline-flex; gap:4px; vertical-align:middle; margin:0 2px}
.setbtns button{width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--input); color:var(--ink); font-weight:800; font-size:15px; cursor:pointer; line-height:1}
.presnote{font-size:12px; font-weight:600; margin-top:5px}
.presnote.up{color:var(--info)} .presnote.hold{color:var(--warn)}
.ovs{color:var(--accent); font-weight:700}
#resttimer{
  position:fixed; left:12px; right:12px;
  bottom:calc(86px + env(safe-area-inset-bottom)); z-index:20;
  display:flex; align-items:center; gap:10px;
  background:var(--accent); color:var(--accent-ink);
  border-radius:12px; padding:10px 14px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#resttimer[hidden]{display:none}
#resttimer b{font-size:22px; font-variant-numeric:tabular-nums; line-height:1}
#resttimer .tname{flex:1; font-size:12px; opacity:.88; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

const NOCALC = new Set(['s1','m4','s6']); // lastre/corporal: sin cálculo de 1RM
// Básicos (multiarticulares): objetivos con RIR 2 y el L frena la progresión (el fallo ahí cuesta caro).
// Aislamientos: objetivos a RIR 1 y estar al límite no frena — es lo esperado cerca del fallo.
const ISO = new Set(['l3','l4','l5','s5','l6','m3','m4','m6','m7','x1','x2','x4','x5','x6','v2','v3','v4','v5','v6','v7','s4','s6']);
// Variante sugerida por ejercicio: a nivel avanzado conviene rotar cada 2-3 ciclos
// o cuando un ejercicio se estanca (mismo patrón, estímulo distinto).
const VAR={
 l1:'press militar sentado con mancuernas', l2:'press inclinado con mancuernas',
 l7:'press plano con mancuernas', l3:'laterales con mancuerna sentado',
 l4:'extensión de tríceps en polea con barra', l5:'press francés con mancuerna a dos manos',
 s5:'curl martillo en polea con cuerda', l6:'crunch en máquina',
 m1:'la otra opción del par (sentadilla ↔ prensa)', v1:'peso muerto rumano con mancuernas',
 m5:'sentadilla búlgara', m7:'extensión unilateral', m3:'gemelo en prensa',
 m4:'crunch invertido en banco declinado',
 x1:'curl con mancuernas de pie', x2:'curl predicador', x3:'la otra opción del par (fondos ↔ press cerrado)',
 x4:'pushdown unilateral', x5:'laterales en máquina', x6:'pájaros con mancuernas',
 v8:'peso muerto convencional', v9:'hip thrust a una pierna', m6:'sissy squat',
 v2:'curl femoral sentado', v3:'gemelo de pie unilateral', v4:'laterales con mancuerna (dropset)',
 v5:'curl inclinado en banco', v6:'pushdown con agarre supino', v7:'rueda abdominal',
 s1:'dominadas agarre supino', s2:'remo con mancuerna a una mano', s3:'jalón agarre ancho',
 s4:'pájaros en polea', s6:'plancha con lastre'
};
// Estancamiento (patrón de avanzado): 3 semanas efectivas seguidas sin subir ni el
// peso ni los objetivos de reps, con la última cargada de L/X. Salidas: descarga
// del ejercicio (~-10%) y reconstruir, o rotar de variante.
function stalledAt(id,w){
  const wks=[];
  for(let x=w-1; x>=1 && wks.length<3; x--){
    if(isDeload(x)) continue;
    if(setsOf(id,x).some(marked)) wks.push(x);
  }
  if(wks.length<3) return false;
  const w3=wks[0], w1=wks[2]; // w3 = más reciente
  const p1=weight(id,w1), p3=weight(id,w3);
  if(p1==null||p3==null||p3>p1) return false;
  const sum=x=>{ const t=targetsFor(id,x)||[]; let acc=0;
    for(const v of t.slice(0,prescribedSets(id,x))) acc+=(v||0); return acc; };
  const s1=sum(w1), s3=sum(w3);
  if(s1>0 && s3>s1) return false; // con la semana base sin objetivos (sin calibrar) solo cuentan peso y esfuerzo
  let lx=0, tot=0;
  for(const st of setsOf(id,w3)){ const f=effOf(st,EX[id]); if(f){ tot++; if(f==='L'||f==='X') lx++; } }
  return tot>0 && lx/tot>=0.5;
}
function est(id){ // [1RM estimada, peso de inicio] desde la marca actual
  const c = S.cur[id]; if(!c||!c[0]||!c[1]) return null;
  const e = EX[id];
  const rm = c[0]*(1+c[1]/30);                 // Epley
  const w = rm/(1+(e[3]+2)/30);                // parte baja del rango con RIR 2
  const st = inc(id)>0 ? Math.floor(w/inc(id))*inc(id) : Math.round(w*2)/2;
  return st>0 ? [Math.round(rm), st] : null;
}
function setsOf(id,w){ return S.reps[id+'-'+w]||[]; }
function marked(s){ return !!(s && (s.r!=null || s.e)); }
function effOf(s,e){ // esfuerzo efectivo: explícito > auto-fallo si reps < mínimo > exigente
  if(!marked(s)) return null;
  if(s.e) return s.e;
  if(s.r!=null && s.r<e[3]) return 'X';
  return 'E';
}
// Recorre la sesión de la semana w aplicando las reglas RIR:
// F×2 seguidas → sube ya · X → baja ya · L×2 seguidas → afloja SOLO el resto de la
// sesión (back-off): la semana siguiente vuelve al peso base — completar las reps al
// límite no es motivo de bajada, solo de no subir todavía.
// per[i] = peso de la serie i · ev[i] = ajuste disparado TRAS la serie i
// cur = peso final de la sesión · next = base de la semana siguiente
function walk(id,w){
  const e = EX[id], base = weight(id,w), arr = setsOf(id,w), k = inc(id);
  let cur = base, easy = 0, hard = 0, ups = 0, downs = 0;
  const per = [], ev = [];
  for(let i=0;i<arr.length;i++){
    per[i] = cur; ev[i] = null;
    const f = effOf(arr[i], e);
    if(!f || cur===null || k<=0) continue;
    if(f==='F'){ easy++; hard=0; if(easy>=2){ if(cur>0&&k/cur<=0.075){ cur=+(cur+k).toFixed(2); ups++; ev[i]='up'; } easy=0; } } // salto >~8% de la carga: no subir en sesión, que suban las reps
    else if(f==='E'){ easy=0; hard=0; }
    else if(f==='L'){ hard++; easy=0; if(hard>=2){ cur=Math.max(0,+(cur-k).toFixed(2)); hard=0; ev[i]='down'; } }
    else if(f==='X'){ easy=0; hard=0; cur=Math.max(0,+(cur-k).toFixed(2)); downs++; ev[i]='down'; }
  }
  let next = base===null ? null : Math.max(0,+(base + k*(ups-downs)).toFixed(2));
  if(base!==null && ups===0 && downs===0 && k>0){ // tope del rango en todas Y ninguna al límite → sube
    const m = arr.filter(marked);
    if(m.length>=e[2] && m.every(s=>{ const f=effOf(s,e); return s.r!=null && s.r>=e[4] && f!=='X' && (f!=='L'||ISO.has(id)); }))
      next=+(base+k).toFixed(2);
  }
  return {per, ev, cur, next, ups, downs, any:arr.some(marked)};
}
// 1RM estimada "viva": mejor serie de la última semana con datos, corregida por RIR
// (F suma 3 reps al fallo estimado, E 1,5, L 0,5, X 0). Sin datos → marca de Config.
const RIRBONUS={F:3,E:1.5,L:0.5,X:0};
function rmAt(id,w){
  for(let ww=w-1; ww>=1; ww--){
    if(isDeload(ww)) continue; // el deload es submáximo a propósito: no estima 1RM
    const arr=setsOf(id,ww);
    if(!arr.some(s=>s&&s.r!=null)) continue;
    const wf=setWeightFn(id,ww);
    let best=null;
    arr.forEach((s,i)=>{
      if(s&&s.r!=null){
        const wt=wf(i);
        if(wt){ const b=RIRBONUS[s.e]??1.5; const v=wt*(1+(s.r+b)/30); if(best===null||v>best) best=v; }
      }
    });
    if(best!==null) return best;
  }
  const r=est(id); return r?r[0]:null;
}
// reps objetivo de la serie i: máximas con ese peso según 1RM, menos RIR 2, menos 1/serie de fatiga
function repTarget(id,rm,wt,i){
  if(rm===null||!wt) return null;
  const e=EX[id], buf=ISO.has(id)?1:2; // aislamientos apuntan más cerca del fallo
  return Math.max(e[3], Math.min(e[4], Math.round(30*(rm/wt-1))-buf-i));
}
// Azules de la semana w (array por serie) — doble progresión guiada:
// serie cumplida (reps ≥ azul, en F o E) → su azul sube +1 la semana siguiente (techo: tope rango);
// no cumplida o en L → se repite; el peso cambió (F×2/X/manual) → recalcula desde la 1RM.
// Todas al tope y cumplidas → walk() sube el peso y aquí resetea solo (peso distinto → fórmula).
function targetsFor(id,w){
  const e=EX[id], lo=e[3], hi=e[4], TOT=6;
  const base=weight(id,w);
  if(isDeload(w)) return Array(TOT).fill(base!==null?lo:null); // deload: mínimo del rango
  const fresh=()=>{ const rm=rmAt(id,w), wk=walk(id,w), out=[];
    for(let i=0;i<TOT;i++){ const wgt = base===null?null:(i<wk.per.length?wk.per[i]:wk.cur);
      out.push(repTarget(id,rm,wgt,i)); } return out; };
  let ww=0;
  for(let x=w-1; x>=1; x--){ if(isDeload(x)) continue; if(setsOf(id,x).some(marked)){ ww=x; break; } }
  if(!ww || weight(id,ww)!==base) return fresh();
  const prevT=targetsFor(id,ww), prevA=setsOf(id,ww), out=[];
  const iso=ISO.has(id);
  let frs=null, allMet=true;
  const nPrev=Math.min(TOT, prescribedSets(id,ww));
  for(let i=0;i<TOT;i++){
    const s=prevA[i], f=s?effOf(s,e):null, pt=prevT[i];
    const done=s&&s.r!=null&&(f==='F'||f==='E'||(iso&&f==='L')); // en aislamientos el límite no frena
    if(pt==null){ // sin azul previo (ejercicios sin 1RM): partir de lo hecho
      if(done) out.push(Math.max(lo,Math.min(hi,s.r)));
      else { frs=frs||fresh(); out.push(frs[i]); if(i<nPrev) allMet=false; }
      continue;
    }
    const met = done && s.r>=pt;
    let v = met ? Math.min(hi,Math.max(pt,s.r)) : pt;
    if(met && f==='F') v=Math.min(hi,v+1); // sobraban 3+: su objetivo salta +2 contando la escalera
    out.push(v);
    if(i<nPrev && !met) allMet=false;
  }
  // Escalera Helms (doble progresión, +1-2 reps/semana en total, no +1 a todas):
  // SOLO si toda la prescripción previa se cumplió (reps ≥ azul, en F/E), +1 rep
  // a las DOS series con azul más bajo. Serie incumplida o en L → todo se repite.
  // 5-5-5-5 cumplida → 6-6-5-5 → 6-6-6-6 → 7-7-6-6 … tope en todas → sube peso.
  if(allMet){
    for(let add=0; add<2; add++){
      let bi=-1, bv=Infinity;
      for(let i=0;i<nPrev;i++){ const v=out[i]; if(v!=null && v<hi && v<bv){ bv=v; bi=i; } }
      if(bi<0) break;
      out[bi]++;
    }
  }
  return out;
}
// ---- prescripción de series (rampa semanas 3-6 con frenos) ----
// +1 serie/semana por GRUPO (lateral, bíceps, tríceps) rotando de ejercicio,
// solo si la semana anterior: todo lo prescrito hecho, sin X, <40% al límite
// y chequeo semanal (sueño/articulaciones) sin marcar mal. No baja nunca sola:
// si no cumples se congela; restar series es decisión manual (botón −).
const RAMPG={lat:['l3','x5','v4'], bi:['x1','x2','v5','s5'], tri:['l4','l5','x3','x4','v6']};
const RAMPOF={}; for(const g in RAMPG) RAMPG[g].forEach(id=>RAMPOF[id]=g);
function rotPick(g,x){ return RAMPG[g][(x-3)%RAMPG[g].length]; }
function gateReason(g,x){ // null = rampa pasa · texto = motivo de congelar (mira semana x-1)
  const pw=x-1, c=S.chk[pw]||{};
  if(c.sl==='bad'||c.jt==='bad') return 'sueño/articulaciones flojos en S'+pw;
  let totP=0, done=0, L=0, X=0, tot=0;
  for(const id of RAMPG[g]){
    totP+=presSets(id,pw);
    for(const s of setsOf(id,pw)){ const f=effOf(s,EX[id]); if(f){ done++; tot++; if(f==='L')L++; if(f==='X')X++; } }
  }
  if(!tot) return 'sin datos en S'+pw;
  if(done<totP) return 'S'+pw+' incompleta ('+done+'/'+totP+' series del grupo)';
  if(X>0) return 'hubo fallo (X) en S'+pw;
  if(L/tot>=0.4) return 'demasiadas series al límite en S'+pw;
  return null;
}
function presSets(id,w){ // prescripción del motor (sin ajuste manual)
  const e=EX[id], base=e[2];
  if(isDeload(w)) return Math.ceil(presSets(id,6)/2); // deload: mitad de lo ganado
  if(w>=C2START) return base; // ciclo 2: volumen base, sin rampa (semana 8+ de déficit)
  if(!e[6]||w<3) return base;
  const g=RAMPOF[id]; let n=base;
  for(let x=3;x<=Math.min(w,6);x++)
    if(rotPick(g,x)===id && !gateReason(g,x)) n++;
  return Math.min(n,6);
}
function prescribedSets(id,w){ // lo que manda hoy: ajuste manual > motor
  const o=S.setsOver[id+'-'+w];
  return (o===undefined||o===''||o===null)?presSets(id,w):Math.max(1,Math.min(6,+o));
}
function weight(id,w){
  const o = S.over[id+'-'+w]; if(o!==undefined&&o!=='') return +o;
  if(w<=1) return (S.base[id]===undefined||S.base[id]==='')?null:+S.base[id];
  if(isDeload(w)){ const kk = walk(id,6); return kk.any ? kk.cur : weight(id,6); } // deload: peso final S6
  if(w===C2START){ const kk = walk(id,6); return kk.any ? kk.next : weight(id,6); } // C2: donde habría seguido el ciclo 1
  const kk = walk(id,w-1);
  if(kk.cur===null) return null;
  return kk.any ? kk.next : weight(id,w-1);
}
function span(w){
  const a = new Date(W1); a.setDate(a.getDate()+7*(w-1));
  const b = new Date(a); b.setDate(b.getDate()+6);
  return a.getDate()+' '+MES[a.getMonth()]+' – '+b.getDate()+' '+MES[b.getMonth()];
}
function currentWeek(){
  const d = Math.floor((Date.now()-W1)/864e5/7)+1;
  return Math.min(TOTW, Math.max(1, d));
}

function exDone(id,w){
  let n=0; for(const s of setsOf(id,w)) if(marked(s)) n++;
  return n>=prescribedSets(id,w);
}
function dayStats(di,w){ // [ejercicios hechos, total] · null en días de descanso
  const d=DAYS[di]; if(!d[2]) return null;
  let done=0;
  for(const e of d[2]) if(exDone(e[0],w)) done++;
  return [done, d[2].length];
}

const $=s=>document.querySelector(s);
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// ---- temporizador de descanso ----
const timer={id:null,end:0,int:null,fired:false};
let actx=null;
function restSecs(str){ // "2-3 min" → punto medio en segundos
  const n=(str.match(/[\d.,]+/g)||[]).map(x=>+x.replace(',','.'));
  if(!n.length) return 90;
  return Math.round((n.length>1?(n[0]+n[1])/2:n[0])*60);
}
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    [[0,880],[0.28,1320]].forEach(([off,hz])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=hz; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.001,t+off);
      g.gain.exponentialRampToValueAtTime(0.4,t+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+off+0.22);
      o.start(t+off); o.stop(t+off+0.24);
    });
  }catch(e){}
}
function startRest(id){
  timer.id=id; timer.end=Date.now()+restSecs(EX[id][8])*1000; timer.fired=false;
  try{ // desbloquear audio dentro del gesto del usuario
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
  if(!timer.int) timer.int=setInterval(tickRest,300);
  tickRest();
}
function stopRest(){
  clearInterval(timer.int); timer.int=null; timer.id=null;
  document.getElementById('resttimer').hidden=true;
}
const IS_ANDROID=/android/i.test(navigator.userAgent);
function sysTimer(){ // pasa el descanso restante al temporizador nativo de Android (suena con pantalla bloqueada)
  if(!timer.id) return;
  const left=Math.max(1,Math.ceil((timer.end-Date.now())/1000));
  const msg=encodeURIComponent('Descanso — '+EX[timer.id][1].slice(0,40));
  location.href='intent:#Intent;action=android.intent.action.SET_TIMER;i.android.intent.extra.alarm.LENGTH='+left
    +';S.android.intent.extra.alarm.MESSAGE='+msg+';B.android.intent.extra.alarm.SKIP_UI=true;end';
}
function tickRest(){
  const el=document.getElementById('resttimer');
  if(!timer.id){ el.hidden=true; return; }
  const left=Math.ceil((timer.end-Date.now())/1000);
  const name=EX[timer.id][1];
  el.hidden=false;
  if(left<=0){
    if(!timer.fired){ timer.fired=true; beep(); try{navigator.vibrate&&navigator.vibrate([200,120,200]);}catch(e){} }
    el.className='done';
    el.innerHTML='<b>✓</b><span class="tname">Descanso cumplido — siguiente serie de '+esc(name)+'</span><button id="rtx">✕</button>';
  }else{
    el.className='';
    el.innerHTML='<b>'+Math.floor(left/60)+':'+(''+left%60).padStart(2,'0')+'</b>'
      +'<span class="tname">descanso · '+esc(name)+'</span>'
      +(IS_ANDROID?'<button id="rtsys" title="Pasar al temporizador del móvil">⏲</button>':'')
      +'<button id="rtx">✕</button>';
  }
  el.querySelector('#rtx').onclick=stopRest;
  const rs=el.querySelector('#rtsys'); if(rs) rs.onclick=sysTimer;
}

  else h+='<details class="howto"><summary>¿Cómo funciona la progresión?</summary><div style="margin-top:6px">La app <b>prescribe</b> series, reps (azul <b>→8</b>) y peso. Cumple TODOS los azules del ejercicio (reps y marca <b>F</b> o <b>E</b>) → la semana siguiente suben +1 las <b>dos series más flojas</b> (escalera: 5-5-5-5 → 6-6-5-5 → 6-6-6-6…); una serie incumplida o en L → se repite toda la prescripción; tope del rango en todas → sube el peso y la escalera arranca de nuevo. Desde la <b>semana 3</b> añade +1 serie/semana rotando entre lateral, bíceps y tríceps, SOLO si la semana anterior quedó completa, sin fallos, sin pasarte de series al límite y con el chequeo en verde; si no, se congela (nunca baja sola). Ajusta a mano con <b>− +</b> si un día no llegas. Marca tras cada serie: <b>F</b> fácil (RIR ≥3) · <b>E</b> exigente (1-2) · <b>L</b> al límite (0-1) · <b>X</b> fallo. Dos F seguidas → sube peso ya · X → baja ya · dos L → afloja el resto de la sesión. <b>Básicos vs aislamientos:</b> los aislamientos apuntan más cerca del fallo (RIR 1), estar al límite (L) no frena su escalera y una serie en F sube su objetivo +2; en ejercicios donde el salto de peso supera el ~8% de la carga, dos F no suben el peso en plena sesión — suben las reps.</div></details>';

// ---- vista de día: un ejercicio a pantalla completa, desliza ↔ para cambiar ----
function exIdx(id){ return dayView===null?-1:DAYS[dayView][2].findIndex(x=>x[0]===id); }
function gotoEx(id,smooth){
  openEx=id; calEx=null;
  const pg=document.getElementById('pager');
  if(pg){ const i=Math.max(0,exIdx(id)); pg.scrollTo({left:i*pg.clientWidth, behavior:smooth?'smooth':'auto'}); }
  updateDayHud();
}
function fullDone(id){ // todas las series prescritas con reps Y esfuerzo (solo reps en deload, sin botones F/E/L/X)
  const arr=setsOf(id,week), n=prescribedSets(id,week), deload=isDeload(week);
  for(let i=0;i<n;i++){ const s=arr[i]; if(!s||s.r==null||(!deload&&!s.e)) return false; }
  return true;
}
// ---- duración: media de ejecución por serie y estimación de sesión ----
// Al marcar dos series seguidas del mismo ejercicio, el intervalo entre marcas
// menos el descanso estipulado ≈ lo que tardas en ejecutar la serie. Se descartan
// muestras absurdas (móvil abandonado, interrupciones) y se guarda una media móvil.
let lastMark=null;
function noteSetDone(id,i){
  const now=Date.now();
  if(lastMark&&lastMark.id===id){
    const sample=Math.round((now-lastMark.t)/1000)-restSecs(EX[id][8]);
    if(sample>=10&&sample<=240){
      const d=(S.dur||(S.dur={}))[id]||(S.dur[id]={n:0,s:0});
      d.n++; d.s+=sample;
      if(d.n>40){ d.s=d.s*40/d.n; d.n=40; } // media móvil: lo reciente pesa más
    }
  }
  lastMark={id:id,set:i,t:now};
}
function exExec(id){ const d=S.dur&&S.dur[id]; return d&&d.n>0 ? d.s/d.n : 45; } // sin datos: 45 s/serie
function estSession(di,w,onlyPending){ // ejecución media + descanso estipulado por cada serie (que quede)
  let tot=0;
  for(const e of DAYS[di][2]){
    const id=e[0], n=prescribedSets(id,w);
    let rem=n;
    if(onlyPending){
      const arr=setsOf(id,w); let m=0;
      for(let i=0;i<n;i++) if(arr[i]&&marked(arr[i])) m++;
      rem=n-m;
    }
    if(rem>0) tot+=rem*(exExec(id)+restSecs(e[8]));
  }
  return tot;
}
function fmtDur(secs){
  const m=Math.round(secs/60);
  return m>=60 ? Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min' : m+' min';
}
// ---- cierre de sesión ----
let askedFin={};
function finKey(){ return dayView+'-'+week; }
function dayTonnage(di,w){
  let t=0;
  for(const e of DAYS[di][2]){
    const arr=setsOf(e[0],w); if(!arr.length) continue;
    const wf=setWeightFn(e[0],w);
    arr.forEach((s,i)=>{ if(s&&s.r!=null){ const x=wf(i); if(x) t+=x*s.r; } });
  }
  return Math.round(t);
}
function maybeAskFinish(){ // al completar el último ejercicio pregunta si cerramos (una sola vez)
  if(dayView===null) return;
  const st=dayStats(dayView,week);
  if(st[0]<st[1]) return;
  if(!DAYS[dayView][2].every(e=>fullDone(e[0]))) return; // mismo criterio que el auto-avance: reps + esfuerzo
  const k=finKey();
  if((S.fin&&S.fin[k])||askedFin[k]) return;
  askedFin[k]=true;
  showFinModal();
}
function showFinModal(){
  if(document.getElementById('finmodal')) return;
  const di=dayView, st=dayStats(di,week);
  let sets=0; DAYS[di][2].forEach(e=>{ for(const s of setsOf(e[0],week)) if(marked(s)) sets++; });
  const ton=dayTonnage(di,week);
  const el=document.createElement('div'); el.id='finmodal';
  el.innerHTML='<div class="fm"><h3>🎉 ¿Has acabado el entrenamiento?</h3>'
    +'<div class="hint" style="margin:0">'+st[1]+' ejercicios · '+sets+' series · '+fmt(ton)+' kg movidos en la sesión de hoy.</div>'
    +'<div class="btns"><button class="btn" id="finyes">Sí, cerrar entrenamiento</button>'
    +'<button class="btn ghost" id="finno">Seguir entrenando</button></div></div>';
  document.body.appendChild(el);
  el.onclick=e=>{ if(e.target===el) el.remove(); };
  el.querySelector('#finno').onclick=()=>el.remove();
  el.querySelector('#finyes').onclick=()=>{
    (S.fin||(S.fin={}))[finKey()]=Date.now();
    save(); stopRest(); clearTimeout(advT); el.remove();
    dayView=null; openEx=null; window.scrollTo(0,0); clearTimeout(rt); render();
  };
}
function queueAdvance(id){ // al completar, pasa solo al siguiente pendiente (1,6 s de margen)
  clearTimeout(advT);
  advT=setTimeout(()=>{
    if(dayView===null||openEx!==id||!fullDone(id)) return;
    const nx=nextPending(dayView,id);
    if(nx) gotoEx(nx,true);
  },1600);
}
function updateDayHud(){ // refresca contador, barra, puntos y tiempo restante sin re-render
  if(dayView===null) return;
  const d=DAYS[dayView], st=dayStats(dayView,week);
  const rem=estSession(dayView,week,true);
  const c=document.getElementById('dcount');
  if(c) c.textContent=st[0]+'/'+st[1]+' ejercicios'+(rem>0?' · quedan ≈'+fmtDur(rem):'');
  const pr=document.querySelector('.dc-prog.day i'); if(pr) pr.style.width=Math.round(st[0]/st[1]*100)+'%';
  document.querySelectorAll('#pdots .pd').forEach((b,i)=>{
    const ex=d[2][i]; if(!ex) return;
    const id=ex[0], done=exDone(id,week);
    b.className='pd'+(done?' done':'')+(openEx===id?' cur':'');
    b.textContent=done?'✓':(i+1);
  });
}
function renderDay(){
  const di=dayView, d=DAYS[di], m=$('#main'), deload=isDeload(week);
  if(openEx===null||exIdx(openEx)<0) openEx=firstPending(di)||d[2][0][0];

  if(deload) h+='<div class="hint" style="margin:0 0 8px">🔸 Deload: mitad de series, peso final de la semana 6. Nada de acercarse al fallo.</div>';
  h+='<div class="hint" style="margin:0 0 8px">Desliza ↔ o toca un número para cambiar de ejercicio — el orden es libre. Haz la serie y toca <b>✓</b>: eliges cómo ha ido y las reps se apuntan solas con el objetivo azul (corrígelas si hiciste otras); «ant» = semana pasada. Con todas marcadas pasa solo al siguiente pendiente.</div>';
  h+='<div class="pager" id="pager">'+d[2].map(e=>'<div class="expage"><div class="excard pagecard">'+exPage(e)+'</div></div>').join('')+'</div>';
  m.innerHTML=h;
  $('#backhome').onclick=()=>{ dayView=null; openEx=null; clearTimeout(advT); window.scrollTo(0,0); clearTimeout(rt); render(); };
  m.querySelectorAll('[data-goex]').forEach(b=>b.onclick=()=>gotoEx(b.dataset.goex,true));
  const pg=$('#pager');
  pg.scrollLeft=Math.max(0,exIdx(openEx))*pg.clientWidth;
  let sT=null;
  pg.onscroll=()=>{ clearTimeout(sT); sT=setTimeout(()=>{
    if(!pg.isConnected||!pg.clientWidth) return; // pager ya desmontado (cambio de vista)
    const i=Math.max(0,Math.min(d[2].length-1,Math.round(pg.scrollLeft/pg.clientWidth)));
    if(!d[2][i]) return;
    if(openEx!==d[2][i][0]){ openEx=d[2][i][0]; updateDayHud(); }
  },90); };
  m.onpointerdown=()=>clearTimeout(advT); // interacción manual cancela el auto-avance
  wireExercise(m);
  updateDayHud();
}
function exPage(e){
  const id=e[0], done=exDone(id,week);
  const pres=prescribedSets(id,week);
  let nm=0; for(const s of setsOf(id,week)) if(marked(s)) nm++;
  return '<div class="pghead"><span class="stx'+(done?' done':nm>0?' part':'')+'">'+(done?'✓':nm+'/'+pres)+'</span>'
    +'<div class="pgt"><div class="pgname">'+esc(e[1])+(e[6]?' <span class="rampa">RAMPA</span>':'')+'</div>'
    +'<div class="pgsub"><span class="chip sm">'+pres+'×'+e[3]+'-'+e[4]+'</span><span class="chip sm">descansa '+e[8]+'</span></div></div></div>'
    +exBody(e);
}
function exBody(e){
  const id=e[0], deload=isDeload(week);
  const eng=presSets(id,week), pres=prescribedSets(id,week);
  const ovS=S.setsOver[id+'-'+week]!==undefined&&S.setsOver[id+'-'+week]!==''&&S.setsOver[id+'-'+week]!==null;
  const arr=setsOf(id,week);
  let lastM=0; arr.forEach((s,i)=>{ if(marked(s)) lastM=i+1; });
  const total=Math.min(6,Math.max(pres,lastM));
  const base=weight(id,week);
  const wk=deload?null:walk(id,week);
  const over=S.over[id+'-'+week]!==undefined&&S.over[id+'-'+week]!=='';
  let pill;
  if(deload) pill='<span class="pill none">fin de ciclo</span>';
  else if(!wk.any||base===null) pill='<span class="pill none">—</span>';
  else pill = wk.next>base ? '<span class="pill up">Próx. sem.: '+wk.next+' kg ⬆</span>'
        : wk.next<base ? '<span class="pill down">Próx. sem.: '+wk.next+' kg ⬇</span>'
        : '<span class="pill rep">Próx. sem.: '+wk.next+' kg =</span>';
  const tg=targetsFor(id,week);
  let presnote='';
  if(!deload && e[6] && week>=3 && week<=6 && RAMPOF[id] && rotPick(RAMPOF[id],week)===id){
    const r=gateReason(RAMPOF[id],week);
    if(!r) presnote='<div class="presnote up">⬆ Rampa: +1 serie esta semana (semana anterior cumplida)</div>';
    else presnote='<div class="presnote hold">Rampa en pausa: '+r+'</div>';
  }
  let stallnote='';
  if(!deload && stalledAt(id,week)){
    const k=inc(id), b90=base==null?null:(k>0?Math.max(k,Math.floor(base*0.9/k)*k):Math.round(base*0.9*2)/2);
    stallnote='<div class="presnote hold">⚠ <b>Estancado 3 semanas</b>: ni el peso ni los objetivos suben y la última semana fue al límite. Opciones: baja a ~'+b90+' kg («ajustar») y reconstruye las reps, o rota de variante'+(VAR[id]?' — p. ej. <i>'+VAR[id]+'</i>':'')+'.</div>';
  }
  let rows='';
  const prevArr = week>1 ? setsOf(id,week-1) : [];
  for(let i=0;i<total;i++){
    const s=arr[i];
    const wgt = base===null?null : deload?base : (i<arr.length?wk.per[i]:wk.cur);
    const tgt = tg[i];
    const f = s&&s.e;
    const ps = prevArr[i];
    const prev = (ps&&ps.r!=null) ? ' <span class="prv" title="Semana pasada: '+ps.r+' reps'+(ps.e?' ('+ps.e+')':'')+'">· ant '+ps.r+(ps.e||'')+'</span>' : '';
    rows+='<div class="setrow'+(i>=eng?' extra':'')+'">'
      +'<span class="setlbl">'+(wgt===null?'—':wgt+' kg')+(tgt!==null?' <b class="tgt">→'+tgt+'</b>':'')+prev+'</span>'
      +'<input type="number" inputmode="numeric" min="0" max="100" placeholder="'+(tgt!==null?tgt:'reps')+'" value="'+(s&&s.r!=null?s.r:'')+'" data-ex="'+id+'" data-set="'+i+'">'
      +'<button class="ckbtn'+(deload?(s&&s.r!=null?' eE':''):(f?' e'+f:''))+'" data-ck="'+id+'" data-set="'+i+'" data-tgt="'+(tgt!==null?tgt:'')+'" title="'+(f?'Cambiar el esfuerzo':'Serie hecha')+'">'+(deload?'✓':(f||'✓'))+'</button>'
      +'</div>';
    if(!deload && i<arr.length && wk.ev[i] && i<total-1){ // sin series restantes no hay nada que ajustar
      const after=(i+1<wk.per.length)?wk.per[i+1]:wk.cur;
      rows+='<div class="adj '+wk.ev[i]+'">'+(wk.ev[i]==='up'?'⬆ Resto de series a '+after+' kg':'⬇ Resto de series a '+after+' kg')+'</div>';
    }
  }
  let nextBtn='';
  if(exDone(id,week)){
    const nx=dayView!==null?nextPending(dayView,id):null;
    if(nx) nextBtn='<button class="btn" data-next="'+id+'" style="margin-top:12px;width:100%">✓ Hecho — siguiente: '+esc(EX[nx][1])+'</button>';
    else if(dayView!==null&&S.fin&&S.fin[dayView+'-'+week]) nextBtn='<div class="hint" style="margin-top:10px">🏁 Entrenamiento cerrado.</div>';
    else nextBtn='<button class="btn" data-fin="1" style="margin-top:12px;width:100%">🏁 Terminar entrenamiento</button>';
  }
  return '<div class="exrow">'

// gráfica histórica del ejercicio: peso de trabajo por semana
function exChartCard(id){
  const pts=[], dataW=[];
  let any=false;
  for(let w=1;w<=TOTW;w++){ const v=weight(id,w); pts.push(v); dataW.push(setsOf(id,w).some(marked)); if(v!=null) any=true; }
  if(!any) return '<div class="exchart"><div class="exchart-t">Progresión de peso</div><div class="hint" style="margin:2px 0 0">La gráfica aparece en cuanto calibres el peso del ejercicio (chip «¿kg? · calibrar» de arriba).</div></div>';
  const W=320,H=112,pl=12,pr=30,pt=16,pb=18;
  const vals=pts.filter(v=>v!=null);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(max-min<1){ max+=1; min=Math.max(0,min-1); }
  const X=w=>pl+(W-pl-pr)*(w-1)/(TOTW-1), Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  [0.25,0.75].forEach(f=>{ const y=pt+(H-pt-pb)*f; s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'; });
  const xy=[]; pts.forEach((v,i)=>{ if(v!=null) xy.push([X(i+1),Y(v),i+1,v]); });
  if(xy.length>1) s+='<polyline points="'+xy.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  let prevVal=null;
  xy.forEach(c=>{
    const cur=c[2]===week;
    s+='<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="'+(cur?5:3.5)+'" fill="'+(dataW[c[2]-1]?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"><title>S'+c[2]+': '+c[3]+' kg'+(dataW[c[2]-1]?'':' (previsto)')+'</title></circle>';
    if(prevVal===null||c[3]!==prevVal||cur) // etiqueta el primer punto, cada cambio de peso y la semana actual
      s+='<text x="'+c[0].toFixed(1)+'" y="'+(c[1]-9).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="'+(cur?'700':'600')+'" fill="'+(cur?'var(--ink)':'var(--mut)')+'">'+c[3]+'</text>';
    prevVal=c[3];
  });
  for(let w=1;w<=TOTW;w++) s+='<text x="'+X(w).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="'+(w===week?'var(--ink)':'var(--mut)')+'"'+(w===week?' font-weight="700"':'')+'>S'+w+'</text>';
  s+='</svg>';
  const rm=NOCALC.has(id)?null:rmAt(id,week);
  return '<div class="exchart"><div class="exchart-t">Progresión de peso</div>'+s
    +'<div class="hint" style="margin:4px 0 0">Punto relleno = semana con series apuntadas · hueco = previsión del plan.'
    +(rm!==null?' 1RM estimada: <b>'+Math.round(rm)+' kg</b>.':'')+'</div></div>';
}

// handlers compartidos de la ficha de ejercicio
function wireExercise(m){
  function slot(id,i){
    const k=id+'-'+week, arr=S.reps[k]||(S.reps[k]=[]);
    return arr[i]||(arr[i]={r:null,e:null});
  }
  m.querySelectorAll('.setrow input').forEach(el=>el.onchange=()=>{
    const o=slot(el.dataset.ex,+el.dataset.set), was=marked(o);
    o.r=el.value===''?null:+el.value;
    if(!was&&marked(o)) noteSetDone(el.dataset.ex,+el.dataset.set);
    if(o.r!=null) startRest(el.dataset.ex);
    queueAdvance(el.dataset.ex);
    save(); maybeAskFinish(); scheduleRender(); // diferido: no romper el tap que sigue al teclado
  });
  function showEffPicker(id,i,tgt){ // hoja: ¿cómo ha ido la serie?
    if(document.getElementById('effmodal')) return;
    const cur=(S.reps[id+'-'+week]||[])[i];
    const el=document.createElement('div'); el.id='effmodal';
    el.innerHTML='<div class="fm"><h3>Serie '+(i+1)+' · '+esc(EX[id][1])+'</h3>'
      +'<div class="hint" style="margin:0">¿Cómo ha ido? Si no escribiste reps, se apuntan las del objetivo.</div>'
      +['F','E','L','X'].map(k=>'<button class="effopt s'+k+((cur&&cur.e===k)?' on':'')+'" data-k="'+k+'"><b>'+k+'</b><span>'+EFFDESC[k]+'</span></button>').join('')
      +'<button class="btn ghost" id="effx" style="width:100%;margin-top:10px">Cancelar</button></div>';
    document.body.appendChild(el);
    el.onclick=e=>{ if(e.target===el) el.remove(); };
    el.querySelector('#effx').onclick=()=>el.remove();
    el.querySelectorAll('.effopt').forEach(ob=>ob.onclick=()=>{
      const o=slot(id,i), k=ob.dataset.k, was=marked(o);
      o.e=(o.e===k)?null:k; // repetir la misma opción la desmarca
      if(o.e&&o.r==null&&tgt!=='') o.r=+tgt;
      if(!was&&marked(o)) noteSetDone(id,i);
      if(o.e) startRest(id);
      el.remove();
      queueAdvance(id);
      save(); maybeAskFinish(); clearTimeout(rt); render();
    });
  }
  m.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ck, i=+b.dataset.set;
    if(isDeload(week)){ // deload sin esfuerzo: el check confirma o quita las reps
      const o=slot(id,i);
      if(o.r==null){ if(b.dataset.tgt!==''){ o.r=+b.dataset.tgt; noteSetDone(id,i); } startRest(id); }
      else o.r=null;
      save(); clearTimeout(rt); render();
      return;
    }
    showEffPicker(id,i,b.dataset.tgt);
  });
  m.querySelectorAll('[data-sminus],[data-splus]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.sminus||b.dataset.splus, k=id+'-'+week;
    const v=Math.max(1,Math.min(6,prescribedSets(id,week)+(b.dataset.splus?1:-1)));
    if(v===presSets(id,week)) delete S.setsOver[k]; else S.setsOver[k]=v;
    save(); clearTimeout(rt); render();
  });
  m.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.cal;
    calEx=(calEx===id)?null:id;
    clearTimeout(rt); render();
  });
  m.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{
    const nx=dayView!==null?nextPending(dayView,b.dataset.next):null;
    if(nx) gotoEx(nx,true);
  });
  m.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>showFinModal());
  const wire=(el,fn)=>{ el.onchange=fn; el.oninput=fn; }; // Android puede no disparar change al cerrar el teclado
  m.querySelectorAll('[data-ckg],[data-crep]').forEach(el=>wire(el,()=>{
    const id=el.dataset.ckg||el.dataset.crep;
    const kg=m.querySelector('[data-ckg="'+id+'"]').value;
    const rp=m.querySelector('[data-crep="'+id+'"]').value;
    if(kg===''&&rp==='') delete S.cur[id]; else S.cur[id]=[+kg||0,+rp||0];
    const r=est(id);
    if(r){
      let hasPrev=false;
      for(let x=1;x<week;x++) if(setsOf(id,x).some(marked)){ hasPrev=true; break; }
      // a mitad de plan la recalibración fija ESTA semana: no reescribe a qué peso
      // se hicieron las series pasadas (los objetivos se recalculan desde la 1RM viva)
      if(week>1&&hasPrev) S.over[id+'-'+week]=r[1];
      else S.base[id]=r[1];
    }
    save(); scheduleRender();
  }));
  m.querySelectorAll('[data-base]').forEach(el=>wire(el,()=>{
    if(el.value==='')delete S.base[el.dataset.base]; else S.base[el.dataset.base]=+el.value;
    save(); scheduleRender();
  }));
  m.querySelectorAll('[data-inc]').forEach(el=>wire(el,()=>{
    if(el.value==='')delete S.inc[el.dataset.inc]; else S.inc[el.dataset.inc]=+el.value;
    save(); scheduleRender();
  }));
  m.querySelectorAll('[data-ovr]').forEach(el=>wire(el,()=>{
    const k=el.dataset.ovr+'-'+week;
    if(el.value.trim()==='') delete S.over[k]; else S.over[k]=+el.value;
    save(); scheduleRender();
  }));
}

const DAYL=['L','M','X','J','V','S','D'];
const fmtS=n=>(Math.round(n*10)/10).toString().replace('.',',');
function volByGroup(w){ // volumen prescrito de toda la tabla, por grupo y por día
  const g={};

    const id=e[0], n=prescribedSets(id,w), mm=MUSC[id]; if(!mm||!n) return;

    add(mm[0],n); mm[1].forEach(sg=>add(sg,n*0.5));

  return g;

const fmt=n=>n.toLocaleString('es-ES');
function latestDataWeek(){
  for(let w=TOTW;w>=1;w--) for(const e of ALLEX) if(setsOf(e[0],w).some(marked)) return w;
  return 0;
}
function setWeightFn(id,w){
  if(isDeload(w)){ const b=weight(id,w); return ()=>b; }
  const k=walk(id,w); return i=>(i<k.per.length?k.per[i]:k.cur);
}
function tonnage(w){
  let t=0;
  for(const e of ALLEX){
    const arr=setsOf(e[0],w); if(!arr.length) continue;
    const wf=setWeightFn(e[0],w);
    arr.forEach((s,i)=>{ if(s&&s.r!=null){ const x=wf(i); if(x) t+=x*s.r; } });
  }
  return Math.round(t);
}
function hardSets(w){ let n=0; for(const e of ALLEX) for(const s of setsOf(e[0],w)) if(marked(s)) n++; return n; }
function groupSets(w){
  const g={};
  for(const e of ALLEX){
    let n=0; for(const s of setsOf(e[0],w)) if(marked(s)) n++;
    if(n) g[GROUP[e[0]]]=(g[GROUP[e[0]]]||0)+n;
  }
  return g;
}
function effortDist(w){
  const c={F:0,E:0,L:0,X:0};
  for(const e of ALLEX) for(const s of setsOf(e[0],w)){ const f=effOf(s,e); if(f) c[f]++; }

    s+='<circle cx="'+X(w).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>Semana '+w+': '+v+' kg</title></circle>';
    if(i===0||i===wks.length-1)
      s+='<text x="'+(X(w)+(i===0?-2:6)).toFixed(1)+'" y="'+(Y(v)-8)+'" text-anchor="'+(i===0?'start':'start')+'" font-size="10.5" font-weight="700" fill="var(--ink)">'+v+'</text>';
    s+='<text x="'+X(w).toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle" font-size="10" fill="var(--mut)">S'+w+'</text>';
  });
  return s+'</svg>';
}
function renderProg(){
  const m=$('#main');
  const lw=latestDataWeek();
  if(!lw){
    if(progWeek===null||progWeek>TOTW) progWeek=week;
    m.innerHTML='<div class="card"><h2>Progreso</h2><div class="hint">Aún no hay series apuntadas. Los gráficos aparecen en cuanto marques la primera serie en Entreno.</div></div>'+volCard(true);
    m.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{ progWeek=+b.dataset.pw; renderProg(); });
    return;
  }
  if(progWeek===null||progWeek>TOTW) progWeek=lw;
  // tiles
  const ton=tonnage(lw), tonPrev=lw>1?tonnage(lw-1):0;
  const sd=sessionsDone(lw), hs=hardSets(lw);
  const bwNow=S.bw[lw], bwPrev=S.bw[lw-1];
  let tonD='<span class="td neu">semana '+lw+'</span>';
  if(tonPrev>0){ const p=Math.round((ton-tonPrev)/tonPrev*100);
    tonD='<span class="td '+(p>=0?'up':'neu')+'">'+(p>=0?'+':'')+p+'% vs S'+(lw-1)+'</span>'; }
  let bwV='—', bwD='<span class="td neu">sin dato S'+lw+'</span>';
  if(bwNow!=null){ bwV=bwNow+'<small> kg</small>';
    if(bwPrev!=null){ const p=((bwNow-bwPrev)/bwPrev*100);
      bwD='<span class="td '+(p<=-0.4&&p>=-0.8?'up':p>0?'dn':'neu')+'">'+(p>0?'+':'')+p.toFixed(1)+'% vs S'+(lw-1)+'</span>';
    } else bwD='<span class="td neu">semana '+lw+'</span>'; }
  const ICO={
    ton:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16M6 8v8M18 8v8M3 10v4M21 10v4"/></svg>',
    ser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    ses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4"/><path d="m9 14.5 2 2 4-4"/></svg>',
    bw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 16 10 10 14 14 20 8"/><polyline points="15 8 20 8 20 13"/></svg>'
  };
  const tile=(ic,val,lbl,delta)=>'<div class="tile"><span class="ti">'+ic+'</span><div class="tv">'+val+'</div><div class="tl">'+lbl+'</div>'+(delta||'')+'</div>';
  let h='<div class="tiles">'
    +tile(ICO.ton, fmt(ton)+'<small> kg</small>', 'Tonelaje', tonD)
    +tile(ICO.ser, hs, 'Series duras', '<span class="td neu">semana '+lw+'</span>')
    +tile(ICO.ses, sd[0]+'<small> / '+sd[1]+'</small>', 'Sesiones', '<span class="td '+(sd[0]===sd[1]?'up':'neu')+'">'+(sd[0]===sd[1]?'semana completa ✓':'en curso')+'</span>')
    +tile(ICO.bw, bwV, 'Peso corporal', bwD)
    +'</div>';
  // tonelaje
  h+='<div class="card"><h2>Tonelaje por semana (kg levantados)</h2><div class="chartwrap">'
    +colChart(Array.from({length:TOTW},(_,i)=>tonnage(i+1)))
    +'</div><div class="hint">Peso × reps de todas las series apuntadas. S7 atenuada: es deload, debe bajar. Los corporales sin lastre no suman.</div></div>';
  // series por grupo
  const gs=groupSets(progWeek);
  const entries=Object.entries(gs).sort((a,b)=>b[1]-a[1]);
  h+='<div class="card"><h2>Series duras por grupo muscular</h2>';
  if(entries.length){
    const gmax=entries[0][1];
    entries.forEach(([g,n])=>{
      h+='<div class="gbar"><span class="glbl">'+g+'</span><div class="gtrack"><div class="gfill" style="width:'+(n/gmax*100).toFixed(0)+'%"></div><b class="gval">'+n+'</b></div></div>';
    });
  } else h+='<div class="hint">Sin series en esta semana.</div>';
  h+='<div class="wk-mini">';
  for(let w=1;w<=TOTW;w++) h+='<button data-pw="'+w+'"'+(w===progWeek?' class="sel"':'')+'>S'+w+'</button>';
  h+='</div></div>';
  // volumen prescrito por grupo muscular (tabla completa, con desglose por día)
  h+=volCard(false);
  // progresión por ejercicio: gráfica fija arriba + selector de tarjetas con % de variación
  const pxList=[];
  DAYS.forEach(d=>{ if(!d[2])return; d[2].forEach(e=>{
    const id=e[0]; if(weight(id,1)===null) return;
    const pts=[]; for(let w=1;w<=lw;w++){ const v=weight(id,w); if(v!=null) pts.push(v); }
    if(!pts.length) return;
    if(!pxList.some(p=>p.id===id)) pxList.push({id, name:e[1], w0:pts[0], w1:pts[pts.length-1]});
  });});
  if(pxList.length){
    if(!progEx||!pxList.some(p=>p.id===progEx)) progEx=pxList[0].id;
    h+='<div class="card"><h2>Progresión de pesos</h2>'
      +'<div class="hint" style="margin:0"><b>'+esc(EX[progEx][1])+'</b></div>'
      +'<div class="pxchart">'+exChartCard(progEx)+'</div>'
      +'<input type="search" id="pxq" placeholder="Buscar ejercicio…" autocomplete="off" value="'+esc(pxQ)+'">'
      +'<div class="pxgrid">'
      +pxList.map(p=>{
        const d100=p.w0>0?Math.round((p.w1-p.w0)/p.w0*100):0;
        const hide=pxQ&&!normTxt(p.name).includes(normTxt(pxQ));
        return '<button class="pxcard'+(p.id===progEx?' sel':'')+'" data-pex="'+p.id+'" data-name="'+esc(p.name)+'"'+(hide?' style="display:none"':'')+'>'
          +'<span class="px-name">'+esc(p.name)+'</span>'
          +'<span class="px-val">'+p.w1+' kg</span>'
          +'<span class="px-delta '+(d100>0?'up':d100<0?'dn':'neu')+'">'+(d100>0?'▲ +'+d100:d100<0?'▼ '+d100:'= 0')+'%</span>'
          +'</button>';
      }).join('')
      +'</div><div class="hint" id="pxnone" style="display:none"></div></div>';
  } else {
    h+='<div class="card"><h2>Progresión de pesos</h2><div class="hint">Calibra el peso de los ejercicios (chip «¿kg? · calibrar» durante el entreno) para ver la progresión.</div></div>';
  }
  // peso corporal
  const bwc=bwChart();
  h+='<div class="card"><h2>Peso corporal</h2>';
  if(bwc) h+='<div class="chartwrap">'+bwc+'</div>';
  else h+='<div class="hint">Apunta el peso del lunes en Entreno; con dos semanas aparece la gráfica.</div>';
  h+='<div class="hint">Objetivo en definición: −0,5-0,7 %/semana. Más rápido dos semanas seguidas = sube 150-200 kcal.</div></div>';
  // esfuerzo RIR
  let effHtml='';
  for(let w=1;w<=lw;w++){
    if(isDeload(w)) continue;
    const c=effortDist(w); const tot=c.F+c.E+c.L+c.X;
    if(!tot) continue;
    effHtml+='<div class="effrow"><span class="efflbl">S'+w+'</span><div class="effbar" title="F '+c.F+' · E '+c.E+' · L '+c.L+' · X '+c.X+'">';
    ['F','E','L','X'].forEach(k=>{
      if(!c[k]) return;
      const pct=c[k]/tot*100;
      effHtml+='<div class="effseg '+k+'" style="width:'+pct.toFixed(1)+'%">'+(pct>=9?k:'')+'</div>';
    });
    effHtml+='</div></div>';
  }
  if(effHtml){
    h+='<div class="card"><h2>Esfuerzo por semana (RIR)</h2>'+effHtml
      +'<div class="lgd"><span><i class="effseg F" style="display:inline-block"></i>F fácil</span><span><i class="effseg E" style="display:inline-block"></i>E exigente</span><span><i class="effseg L" style="display:inline-block"></i>L al límite</span><span><i class="effseg X" style="display:inline-block"></i>X fallo</span></div>'
      +'<div class="hint">Orden fijo F→E→L→X. Lo sano en definición: mayoría E, algo de L, F e X puntuales. Mucha F = pesos cortos; mucha L/X = pasado de rosca.</div></div>';
  }
  m.innerHTML=h;
  m.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{ progWeek=+b.dataset.pw; renderProg(); });
  m.querySelectorAll('[data-pex]').forEach(b=>b.onclick=()=>{ progEx=b.dataset.pex; renderProg(); });
  const pxi=$('#pxq');
  if(pxi){ pxi.oninput=()=>{ pxQ=pxi.value; applyPxFilter(); }; applyPxFilter(); }
}

// ---- tema claro / oscuro / automático (preferencia por dispositivo) ----
const TKEY='plan-hipertrofia-theme';
const TICON={
  '':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"/></svg>'
};
let theme='';
try{ theme=localStorage.getItem(TKEY)||''; }catch(e){}
function applyTheme(){
  if(theme) document.documentElement.dataset.theme=theme;
  else delete document.documentElement.dataset.theme;
  const b=document.getElementById('themebtn');
  b.innerHTML=TICON[theme];
  b.title='Tema: '+(theme===''?'automático (sistema)':theme==='light'?'claro':'oscuro')+' — toca para cambiar';
  const dark = theme==='dark' || (theme===''&&matchMedia('(prefers-color-scheme: dark)').matches);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.content = dark ? '#10181c' : '#1f4e5f';
}
document.getElementById('themebtn').onclick=()=>{
  theme = theme===''?'light' : theme==='light'?'dark' : '';
  try{ if(theme) localStorage.setItem(TKEY,theme); else localStorage.removeItem(TKEY); }catch(e){}
  applyTheme();
};
