<!doctype html>
<meta charset="utf-8">
<title>Entrenamiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entrenamiento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --ink:#1a2429; --mut:#5c6b73;
  --accent:#1f4e5f; --accent-ink:#ffffff; --line:#d5dde1;
  --ok:#2e7d4f; --ok-bg:#e2f2e8; --warn:#8a6d3b; --warn-bg:#f6efdf;
  --bad:#a84848; --bad-bg:#f4e3e3; --info:#2c6e8f; --info-bg:#e3eef4;
  --ok-ink:#ffffff;
  --input:#fbfdfe; --chip:#e7f0f4; --grey:#c9d2d8;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10181c; --surface:#1a252c; --surface2:#141e23; --ink:#e8eef1; --mut:#93a4ad;
  --accent:#4fa3b8; --accent-ink:#0c1418; --line:#2a3840;
  --ok:#6fbf8f; --ok-bg:#1c3226; --warn:#d4b578; --warn-bg:#32291a;
  --bad:#d98383; --bad-bg:#3a2222; --info:#7cc0d8; --info-bg:#1d3742;
  --ok-ink:#0c1418;
  --input:#0e161a; --chip:#22333c; --grey:#3a4a53;
}}
:root[data-theme="dark"]{
  --bg:#10181c; --surface:#1a252c; --surface2:#141e23; --ink:#e8eef1; --mut:#93a4ad;
  --accent:#4fa3b8; --accent-ink:#0c1418; --line:#2a3840;
  --ok:#6fbf8f; --ok-bg:#1c3226; --warn:#d4b578; --warn-bg:#32291a;
  --bad:#d98383; --bad-bg:#3a2222; --info:#7cc0d8; --info-bg:#1d3742;
  --ok-ink:#0c1418;
  --input:#0e161a; --chip:#22333c; --grey:#3a4a53;
}
:root[data-theme="light"]{
  --bg:#f2f5f6; --surface:#ffffff; --surface2:#e9eef0; --ink:#1a2429; --mut:#5c6b73;
  --accent:#1f4e5f; --accent-ink:#ffffff; --line:#d5dde1;
  --ok:#2e7d4f; --ok-bg:#e2f2e8; --warn:#8a6d3b; --warn-bg:#f6efdf;
  --bad:#a84848; --bad-bg:#f4e3e3; --info:#2c6e8f; --info-bg:#e3eef4;
  --ok-ink:#ffffff;
  --input:#fbfdfe; --chip:#e7f0f4; --grey:#c9d2d8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
header{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:12px 14px 8px; border-bottom:1px solid var(--line);
}
h1{font-size:17px; margin:0 0 2px; letter-spacing:.2px}
.sub{font-size:12px; color:var(--mut)}
.weekbar{display:flex; gap:6px; overflow-x:auto; padding:10px 0 4px; -webkit-overflow-scrolling:touch}
.weekbar::-webkit-scrollbar{display:none}
.wchip{
  flex:0 0 auto; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600;
  cursor:pointer;
}
.wchip.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.wchip .d{display:block; font-size:10px; font-weight:400; opacity:.75}
main{padding:12px 12px 24px; max-width:640px; margin:0 auto}
/* ---- portada: tarjetas de día ---- */
.daycard{
  display:block; width:100%; text-align:left; font:inherit; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; margin:0 0 10px; cursor:pointer;
}
.daycard.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.daycard.rest{cursor:default; background:var(--surface2)}
.dc-top{display:flex; align-items:center; gap:8px}
.dc-day{font-size:11px; font-weight:800; letter-spacing:.8px; color:var(--mut)}
.dc-today{background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:2px 8px; font-size:10px; font-weight:800; letter-spacing:.5px}
.dc-state{margin-left:auto; font-size:12px; font-weight:700; border-radius:999px; padding:4px 10px; background:var(--chip); color:var(--accent); white-space:nowrap}
.dc-state.ok{background:var(--ok-bg); color:var(--ok)}
.dc-state.part{background:var(--info-bg); color:var(--info)}
.dc-state.mut{background:var(--surface2); color:var(--mut); font-weight:500}
.dc-title{font-size:16px; font-weight:700; margin-top:3px}
.dc-meta{font-size:12px; color:var(--mut); margin-top:2px}
.dc-prog{height:5px; background:var(--surface2); border-radius:99px; margin-top:10px; overflow:hidden}
.dc-prog.day{margin:10px 0 14px; background:var(--surface)}
.dc-prog i{display:block; height:100%; background:var(--ok); border-radius:99px}
.dc-det{margin-top:6px; font-size:12px; color:var(--mut)}
.dc-det summary{cursor:pointer; font-weight:700}
.howto{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 14px; font-size:12.5px; color:var(--mut)}
.howto summary{cursor:pointer; font-weight:700; color:var(--ink); font-size:13px}
.syncrow{display:flex; gap:8px; flex-wrap:wrap}
.syncrow label{flex:1 1 140px; font-size:12px; color:var(--mut)}
.syncrow input{width:100%; height:40px; font-size:13px; padding:0 8px; background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px; box-sizing:border-box}
.syncrow input:focus{outline:2px solid var(--accent); outline-offset:-1px}
/* ---- vista de día: sesión guiada ---- */
.daybar{display:flex; align-items:center; gap:10px; margin:2px 0 6px}
.backbtn{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px; cursor:pointer; flex:0 0 auto}
.dbt{min-width:0}
.dbt b{display:block; font-size:15px}
.dbt span{font-size:12px; color:var(--mut)}
.excard{background:var(--surface); border:1px solid var(--line); border-radius:12px}
.pagecard{padding:12px}
.pghead{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.pgname{font-size:15.5px; font-weight:700; line-height:1.25}
.pgsub{font-size:12px; color:var(--mut); margin-top:1px}
.stx{flex:0 0 36px; height:36px; border-radius:999px; background:var(--surface2); color:var(--mut); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums}
.stx.part{background:var(--info-bg); color:var(--info)}
.stx.done{background:var(--ok); color:var(--ok-ink); font-size:15px}
.pager{display:flex; align-items:flex-start; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:0 -12px}
.pager::-webkit-scrollbar{display:none}
.expage{flex:0 0 100%; min-width:0; scroll-snap-align:start; scroll-snap-stop:always; padding:0 12px 4px; box-sizing:border-box}
.pagerdots{display:flex; gap:6px; margin:0 0 10px; flex-wrap:wrap}
.pd{width:30px; height:30px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--mut); font-size:12px; font-weight:800; cursor:pointer; font-variant-numeric:tabular-nums}
.pd.done{background:var(--ok); border-color:var(--ok); color:var(--ok-ink)}
.pd.cur{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); color:var(--accent)}
.pd.done.cur{color:var(--ok-ink)}
.exchart{margin-top:12px; border-top:1px solid var(--line); padding-top:8px}
.exchart-t{font-size:12.5px; font-weight:700; margin-bottom:4px}
.exchart svg{width:100%; height:auto; display:block}
.calpanel{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px}
.ex{border-bottom:1px solid var(--line); padding:10px 0 12px}
.ex:last-child{border-bottom:0}
.exrow{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.exname{font-weight:600; font-size:14px; flex:1 1 200px}
.exmeta{font-size:12px; color:var(--mut); margin-top:2px}
.wchipbig{
  background:var(--chip); border:1px dashed var(--line); border-radius:8px;
  padding:4px 10px; font-weight:700; font-variant-numeric:tabular-nums; font-size:15px;
  cursor:pointer; white-space:nowrap;
}
.wchipbig.over{border-style:solid; border-color:var(--accent)}
.sets{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center}
.sets input{
  width:52px; height:44px; text-align:center; font-size:17px; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink);
  background:var(--input); border:1px solid var(--line); border-radius:8px;
}
.sets input.extra{border-style:dashed; opacity:.85}
.sets input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.setrow{display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:nowrap}
.setrow.extra .setlbl{opacity:.65}
.setrow.extra input{border-style:dashed}
.setlbl{
  flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:12.5px; color:var(--mut); font-variant-numeric:tabular-nums; font-weight:600;
}
.setlbl .tgt{color:var(--accent)}
.setrow input{
  flex:0 0 54px; width:54px; height:42px; text-align:center; font-size:16px; font-weight:600;
  font-variant-numeric:tabular-nums; color:var(--ink);
  background:var(--input); border:1px solid var(--line); border-radius:8px;
}
.setrow input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.eff{display:flex; gap:3px; flex:0 0 auto}
.eff button{
  width:34px; height:42px; border-radius:8px; border:1px solid var(--line);
  background:var(--input); color:var(--mut); font-weight:800; font-size:13px; cursor:pointer; padding:0;
}
.eff .sF.on{background:var(--info-bg); color:var(--info); border-color:var(--info)}
.eff .sE.on{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.eff .sL.on{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
.eff .sX.on{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.adj{font-size:12.5px; font-weight:700; border-radius:8px; padding:5px 10px; margin-top:6px; display:inline-block}
.adj.up{background:var(--info-bg); color:var(--info)}
.adj.down{background:var(--bad-bg); color:var(--bad)}
.pill.down{background:var(--bad-bg); color:var(--bad)}
.pill{
  margin-left:auto; font-size:12px; font-weight:700; border-radius:999px; padding:5px 11px;
  white-space:nowrap;
}
.pill.up{background:var(--ok-bg); color:var(--ok)}
.pill.rep{background:var(--warn-bg); color:var(--warn)}
.pill.none{background:var(--surface2); color:var(--mut); font-weight:500}
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  display:flex; align-items:stretch; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:0; color:var(--mut); font:inherit; font-size:11px; font-weight:600;
  letter-spacing:.2px; padding:9px 0 10px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .nic{width:23px; height:23px}
nav button.sel{color:var(--accent); font-weight:700}
#nav-today{
  flex:0 0 auto; width:56px; height:56px; padding:0; border-radius:50%;
  align-self:center; margin:-22px 4px 6px;
  background:linear-gradient(135deg,#2a6478,#16394a);
  border:3px solid var(--bg); box-shadow:0 3px 10px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center;
}
#nav-today svg{width:32px; height:32px}
#nav-today:active{transform:scale(.96)}
table{border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line); padding:6px 7px; text-align:center}
th{background:var(--surface2); font-size:12px}
td.exn{text-align:left; font-size:12.5px}
.tablewrap{overflow-x:auto; border-radius:8px}
.cfgex{border-bottom:1px solid var(--line); padding:10px 0}
.cfgex:last-child{border-bottom:0}
.cfgrow{display:flex; gap:8px; align-items:center; margin-top:6px; flex-wrap:wrap}
.cfgrow label{font-size:12px; color:var(--mut)}
.cfgrow input{
  width:74px; height:40px; text-align:center; font-size:16px; font-weight:600;
  background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px;
  font-variant-numeric:tabular-nums;
}
.cfgrow input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.tile .tl{font-size:11px; color:var(--mut)}
.tile .tv{font-size:22px; font-weight:700; margin-top:2px; line-height:1.1}
.tile .tv small{font-size:12px; font-weight:600; color:var(--mut)}
.tile .td{font-size:11px; font-weight:600; margin-top:2px}
.tile .td.up{color:var(--ok)} .tile .td.dn{color:var(--bad)} .tile .td.neu{color:var(--mut)}
.gbar{display:flex; align-items:center; gap:8px; margin-top:7px}
.glbl{flex:0 0 90px; font-size:12px; color:var(--mut); text-align:right}
.gtrack{flex:1; display:flex; align-items:center; gap:6px}
.gfill{height:14px; background:var(--accent); border-radius:0 4px 4px 0; min-width:2px}
.gval{font-size:12px; font-weight:700; font-variant-numeric:tabular-nums}
.gdays{font-size:11px; color:var(--mut); margin:1px 0 6px 98px; font-variant-numeric:tabular-nums}
.effrow{display:flex; align-items:center; gap:8px; margin-top:7px}
.efflbl{flex:0 0 22px; font-size:12px; color:var(--mut); font-weight:700}
.effbar{flex:1; display:flex; gap:2px; height:20px; border-radius:5px; overflow:hidden}
.effseg{display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; color:var(--accent-ink)}
.effseg.F{background:var(--info)} .effseg.E{background:var(--ok)}
.effseg.L{background:var(--warn)} .effseg.X{background:var(--bad)}
.lgd{display:flex; gap:12px; flex-wrap:wrap; margin-top:9px; font-size:11px; color:var(--mut)}
.lgd i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px}
.sparkrow{
  display:flex; align-items:center; gap:8px; border:0; border-bottom:1px solid var(--line);
  padding:7px 0; width:100%; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer;
}
.sparkwrap:last-child .sparkrow{border-bottom:0}
.sparkdetail{padding:0 0 10px; border-bottom:1px solid var(--line)}
.sparkwrap:last-child .sparkdetail{border-bottom:0}
.sparkdetail .exchart{margin-top:4px; border-top:0; padding-top:0}
.spname{flex:1; font-size:12.5px; min-width:0}
.spvals{font-size:12px; font-variant-numeric:tabular-nums; color:var(--mut); white-space:nowrap}
.spvals b{color:var(--ink)}
.wk-mini{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
.wk-mini button{border:1px solid var(--line); background:var(--input); color:var(--mut); border-radius:7px; padding:4px 9px; font-size:12px; font-weight:700; cursor:pointer}
.wk-mini button.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.chartwrap svg{width:100%; height:auto; display:block}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:14px}
.card h2{font-size:14px; margin:0 0 8px}
.hint{font-size:12.5px; color:var(--mut); margin:6px 0}
.btn{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px;
  padding:10px 14px; font-size:14px; font-weight:700; cursor:pointer;
}
.btn.ghost{background:var(--surface2); color:var(--ink)}
textarea{
  width:100%; min-height:70px; background:var(--input); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; font-size:11px; padding:8px;
}
.rampa{color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.4px}
.chk{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--mut); margin:0 0 12px}
.chk .cbtns{display:flex; gap:4px}
.chk button{width:36px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--input); color:var(--mut); font-weight:800; cursor:pointer}
.chk button.ok.on{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.chk button.bad.on{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.setbtns{display:inline-flex; gap:4px; vertical-align:middle; margin:0 2px}
.setbtns button{width:30px; height:30px; border-radius:7px; border:1px solid var(--line); background:var(--input); color:var(--ink); font-weight:800; font-size:15px; cursor:pointer; line-height:1}
.presnote{font-size:12px; font-weight:600; margin-top:5px}
.presnote.up{color:var(--info)} .presnote.hold{color:var(--warn)}
.ovs{color:var(--accent); font-weight:700}
.bw{display:flex; align-items:center; gap:10px; margin:2px 0 12px; font-size:13px; color:var(--mut)}
.bw input{
  width:80px; height:40px; text-align:center; font-size:16px; font-weight:600;
  background:var(--input); color:var(--ink); border:1px solid var(--line); border-radius:8px;
}
#resttimer{
  position:fixed; left:12px; right:12px;
  bottom:calc(86px + env(safe-area-inset-bottom)); z-index:20;
  display:flex; align-items:center; gap:10px;
  background:var(--accent); color:var(--accent-ink);
  border-radius:12px; padding:10px 14px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
#resttimer[hidden]{display:none}
#resttimer b{font-size:22px; font-variant-numeric:tabular-nums; line-height:1}
#resttimer .tname{flex:1; font-size:12px; opacity:.88; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#resttimer button{
  background:rgba(0,0,0,.15); border:0; color:inherit; border-radius:8px;
  width:34px; height:34px; font-size:14px; cursor:pointer; flex:0 0 auto;
}
#resttimer.done{background:var(--ok); color:var(--ok-ink)}
@media (prefers-reduced-motion: reduce){ .pager{scroll-behavior:auto} }
</style>

<header>
  <h1>Entrenamiento</h1>
  <div class="sub" id="subline">Hipertrofia 7 semanas · definición 2.400 kcal · desde el 3 ago 2026</div>
  <div class="weekbar" id="weekbar"></div>
</header>
<main id="main"></main>
<div id="resttimer" hidden></div>
<nav>
  <button id="nav-train" class="sel"><svg class="nic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="14.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="14.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="16" cy="14.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="8" cy="17.8" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="17.8" r="1.15" fill="currentColor" stroke="none"/></svg><span>Entreno</span></button>
  <button id="nav-today" title="Ir a la sesión de hoy"><svg viewBox="0 0 512 512" aria-hidden="true"><g transform="rotate(-30 256 256)" fill="#ffffff"><rect x="150" y="246" width="212" height="20" rx="10"/><rect x="120" y="196" width="34" height="120" rx="12"/><rect x="84" y="216" width="26" height="80" rx="10"/><rect x="358" y="196" width="34" height="120" rx="12"/><rect x="402" y="216" width="26" height="80" rx="10"/></g></svg></button>

</nav>

<script>
'use strict';
window.onerror=function(m,s,l){try{
  let d=document.getElementById('errbar');
  if(!d){ d=document.createElement('div'); d.id='errbar';
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#a84848;color:#fff;font:12px/1.4 monospace;padding:8px 12px';
    d.onclick=()=>d.remove(); document.body.appendChild(d); }
  d.textContent='⚠ '+m+' (línea '+l+') — toca para cerrar';
}catch(e){}};

function inc(id){ const v = S.inc[id]; return (v===undefined||v==='') ? EX[id][5] : +v; }
const NOCALC = new Set(['s1','m4','s6']); // lastre/corporal: sin cálculo de 1RM
function est(id){ // [1RM estimada, peso de inicio] desde la marca actual
  const c = S.cur[id]; if(!c||!c[0]||!c[1]) return null;
  const e = EX[id];
  const rm = c[0]*(1+c[1]/30);                 // Epley
  const w = rm/(1+(e[3]+2)/30);                // parte baja del rango con RIR 2
  const st = inc(id)>0 ? Math.floor(w/inc(id))*inc(id) : Math.round(w*2)/2;
  return st>0 ? [Math.round(rm), st] : null;
}
function setsOf(id,w){ return S.reps[id+'-'+w]||[]; }
function marked(s){ return !!(s && (s.r!=null || s.e)); }
function effOf(s,e){ // esfuerzo efectivo: explícito > auto-fallo si reps < mínimo > exigente
  if(!marked(s)) return null;
  if(s.e) return s.e;
  if(s.r!=null && s.r<e[3]) return 'X';
  return 'E';
}
// Recorre la sesión de la semana w aplicando las reglas RIR:
// F×2 seguidas → sube ya · X → baja ya · L×2 seguidas → afloja SOLO el resto de la
// sesión (back-off): la semana siguiente vuelve al peso base — completar las reps al
// límite no es motivo de bajada, solo de no subir todavía.
// per[i] = peso de la serie i · ev[i] = ajuste disparado TRAS la serie i
// cur = peso final de la sesión · next = base de la semana siguiente
function walk(id,w){
  const e = EX[id], base = weight(id,w), arr = setsOf(id,w), k = inc(id);
  let cur = base, easy = 0, hard = 0, ups = 0, downs = 0;
  const per = [], ev = [];
  for(let i=0;i<arr.length;i++){
    per[i] = cur; ev[i] = null;
    const f = effOf(arr[i], e);
    if(!f || cur===null || k<=0) continue;
    if(f==='F'){ easy++; hard=0; if(easy>=2){ cur=+(cur+k).toFixed(2); ups++; easy=0; ev[i]='up'; } }
    else if(f==='E'){ easy=0; hard=0; }
    else if(f==='L'){ hard++; easy=0; if(hard>=2){ cur=Math.max(0,+(cur-k).toFixed(2)); hard=0; ev[i]='down'; } }
    else if(f==='X'){ easy=0; hard=0; cur=Math.max(0,+(cur-k).toFixed(2)); downs++; ev[i]='down'; }
  }
  let next = base===null ? null : Math.max(0,+(base + k*(ups-downs)).toFixed(2));
  if(base!==null && ups===0 && downs===0 && k>0){ // tope del rango en todas Y ninguna al límite → sube
    const m = arr.filter(marked);
    if(m.length>=e[2] && m.every(s=>{ const f=effOf(s,e); return s.r!=null && s.r>=e[4] && f!=='L' && f!=='X'; }))
      next=+(base+k).toFixed(2);
  }
  return {per, ev, cur, next, ups, downs, any:arr.some(marked)};
}
// 1RM estimada "viva": mejor serie de la última semana con datos, corregida por RIR
// (F suma 3 reps al fallo estimado, E 1,5, L 0,5, X 0). Sin datos → marca de Config.
const RIRBONUS={F:3,E:1.5,L:0.5,X:0};
function rmAt(id,w){
  for(let ww=Math.min(w-1,6); ww>=1; ww--){
    const arr=setsOf(id,ww);
    if(!arr.some(s=>s&&s.r!=null)) continue;
    const wf=setWeightFn(id,ww);
    let best=null;
    arr.forEach((s,i)=>{
      if(s&&s.r!=null){
        const wt=wf(i);
        if(wt){ const b=RIRBONUS[s.e]??1.5; const v=wt*(1+(s.r+b)/30); if(best===null||v>best) best=v; }
      }
    });
    if(best!==null) return best;
  }
  const r=est(id); return r?r[0]:null;
}
// reps objetivo de la serie i: máximas con ese peso según 1RM, menos RIR 2, menos 1/serie de fatiga
function repTarget(id,rm,wt,i){
  if(rm===null||!wt) return null;
  const e=EX[id];
  return Math.max(e[3], Math.min(e[4], Math.round(30*(rm/wt-1))-2-i));
}
// Azules de la semana w (array por serie) — doble progresión guiada:
// serie cumplida (reps ≥ azul, en F o E) → su azul sube +1 la semana siguiente (techo: tope rango);
// no cumplida o en L → se repite; el peso cambió (F×2/X/manual) → recalcula desde la 1RM.
// Todas al tope y cumplidas → walk() sube el peso y aquí resetea solo (peso distinto → fórmula).
function targetsFor(id,w){
  const e=EX[id], lo=e[3], hi=e[4], TOT=6;
  const base=weight(id,w);
  if(w===7) return Array(TOT).fill(base!==null?lo:null); // deload: mínimo del rango
  const fresh=()=>{ const rm=rmAt(id,w), wk=walk(id,w), out=[];
    for(let i=0;i<TOT;i++){ const wgt = base===null?null:(i<wk.per.length?wk.per[i]:wk.cur);
      out.push(repTarget(id,rm,wgt,i)); } return out; };
  let ww=0;
  for(let x=Math.min(w-1,6); x>=1; x--){ if(setsOf(id,x).some(marked)){ ww=x; break; } }
  if(!ww || weight(id,ww)!==base) return fresh();
  const prevT=targetsFor(id,ww), prevA=setsOf(id,ww), out=[];
  let frs=null, allMet=true;
  const nPrev=Math.min(TOT, prescribedSets(id,ww));
  for(let i=0;i<TOT;i++){
    const s=prevA[i], f=s?effOf(s,e):null, pt=prevT[i];
    const done=s&&s.r!=null&&(f==='F'||f==='E');
    if(pt==null){ // sin azul previo (ejercicios sin 1RM): partir de lo hecho
      if(done) out.push(Math.max(lo,Math.min(hi,s.r)));
      else { frs=frs||fresh(); out.push(frs[i]); if(i<nPrev) allMet=false; }
      continue;
    }
    const met = done && s.r>=pt;
    out.push(met ? Math.min(hi,Math.max(pt,s.r)) : pt);
    if(i<nPrev && !met) allMet=false;
  }
  // Escalera Helms (doble progresión, +1-2 reps/semana en total, no +1 a todas):
  // SOLO si toda la prescripción previa se cumplió (reps ≥ azul, en F/E), +1 rep
  // a las DOS series con azul más bajo. Serie incumplida o en L → todo se repite.
  // 5-5-5-5 cumplida → 6-6-5-5 → 6-6-6-6 → 7-7-6-6 … tope en todas → sube peso.
  if(allMet){
    for(let add=0; add<2; add++){
      let bi=-1, bv=Infinity;
      for(let i=0;i<nPrev;i++){ const v=out[i]; if(v!=null && v<hi && v<bv){ bv=v; bi=i; } }
      if(bi<0) break;
      out[bi]++;
    }
  }
  return out;
}
// ---- prescripción de series (rampa semanas 3-6 con frenos) ----
// +1 serie/semana por GRUPO (lateral, bíceps, tríceps) rotando de ejercicio,
// solo si la semana anterior: todo lo prescrito hecho, sin X, <40% al límite
// y chequeo semanal (sueño/articulaciones) sin marcar mal. No baja nunca sola:
// si no cumples se congela; restar series es decisión manual (botón −).
const RAMPG={lat:['l3','x5','v4'], bi:['x1','x2','v5','s5'], tri:['l4','l5','x3','x4','v6']};
const RAMPOF={}; for(const g in RAMPG) RAMPG[g].forEach(id=>RAMPOF[id]=g);
function rotPick(g,x){ return RAMPG[g][(x-3)%RAMPG[g].length]; }
function gateReason(g,x){ // null = rampa pasa · texto = motivo de congelar (mira semana x-1)
  const pw=x-1, c=S.chk[pw]||{};
  if(c.sl==='bad'||c.jt==='bad') return 'sueño/articulaciones flojos en S'+pw;
  let totP=0, done=0, L=0, X=0, tot=0;
  for(const id of RAMPG[g]){
    totP+=presSets(id,pw);
    for(const s of setsOf(id,pw)){ const f=effOf(s,EX[id]); if(f){ done++; tot++; if(f==='L')L++; if(f==='X')X++; } }
  }
  if(!tot) return 'sin datos en S'+pw;
  if(done<totP) return 'S'+pw+' incompleta ('+done+'/'+totP+' series del grupo)';
  if(X>0) return 'hubo fallo (X) en S'+pw;
  if(L/tot>=0.4) return 'demasiadas series al límite en S'+pw;
  return null;
}
function presSets(id,w){ // prescripción del motor (sin ajuste manual)
  const e=EX[id], base=e[2];
  if(w>=7) return Math.ceil(presSets(id,6)/2); // deload: mitad de lo ganado
  if(!e[6]||w<3) return base;
  const g=RAMPOF[id]; let n=base;
  for(let x=3;x<=Math.min(w,6);x++)
    if(rotPick(g,x)===id && !gateReason(g,x)) n++;
  return Math.min(n,6);
}
function prescribedSets(id,w){ // lo que manda hoy: ajuste manual > motor
  const o=S.setsOver[id+'-'+w];
  return (o===undefined||o===''||o===null)?presSets(id,w):Math.max(1,Math.min(6,+o));
}
function weight(id,w){
  const o = S.over[id+'-'+w]; if(o!==undefined&&o!=='') return +o;
  if(w<=1) return (S.base[id]===undefined||S.base[id]==='')?null:+S.base[id];
  if(w>=7){ const kk = walk(id,6); return kk.any ? kk.cur : weight(id,6); } // deload: peso final S6
  const kk = walk(id,w-1);
  if(kk.cur===null) return null;
  return kk.any ? kk.next : weight(id,w-1);
}

const timer={id:null,end:0,int:null,fired:false};
let actx=null;
function restSecs(str){ // "2-3 min" → punto medio en segundos
  const n=(str.match(/[\d.,]+/g)||[]).map(x=>+x.replace(',','.'));
  if(!n.length) return 90;
  return Math.round((n.length>1?(n[0]+n[1])/2:n[0])*60);
}
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    [[0,880],[0.28,1320]].forEach(([off,hz])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=hz; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.001,t+off);
      g.gain.exponentialRampToValueAtTime(0.4,t+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+off+0.22);
      o.start(t+off); o.stop(t+off+0.24);
    });
  }catch(e){}
}
function startRest(id){
  timer.id=id; timer.end=Date.now()+restSecs(EX[id][8])*1000; timer.fired=false;
  try{ // desbloquear audio dentro del gesto del usuario
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
  if(!timer.int) timer.int=setInterval(tickRest,300);
  tickRest();
}
function stopRest(){
  clearInterval(timer.int); timer.int=null; timer.id=null;

}

  const left=Math.max(1,Math.ceil((timer.end-Date.now())/1000));
  const msg=encodeURIComponent('Descanso — '+EX[timer.id][1].slice(0,40));
  location.href='intent:#Intent;action=android.intent.action.SET_TIMER;i.android.intent.extra.alarm.LENGTH='+left
    +';S.android.intent.extra.alarm.MESSAGE='+msg+';B.android.intent.extra.alarm.SKIP_UI=true;end';
}
function tickRest(){
  const el=document.getElementById('resttimer');
  if(!timer.id){ el.hidden=true; return; }
  const left=Math.ceil((timer.end-Date.now())/1000);
  const name=EX[timer.id][1];
  el.hidden=false;
  if(left<=0){
    if(!timer.fired){ timer.fired=true; beep(); try{navigator.vibrate&&navigator.vibrate([200,120,200]);}catch(e){} }
    el.className='done';
    el.innerHTML='<b>✓</b><span class="tname">Descanso cumplido — siguiente serie de '+esc(name)+'</span><button id="rtx">✕</button>';

    el.innerHTML='<b>'+Math.floor(left/60)+':'+(''+left%60).padStart(2,'0')+'</b>'

const REST_TXT={
 JUEVES:'Zona 2: 30-40 min a <b>113-132 lpm</b> (apunta a 118-128; si derivas por encima de 132, afloja). Cinta inclinada ~6-6,5 km/h al 10-12% o bici 85-95 rpm. Test del habla: frases completas sí, cantar no. Opcional 1×/sem en su lugar: 4×4 min llegando a <b>169-179 lpm</b>, recuperando 3 min, <b>por la mañana</b> — nunca jueves noche.',
 DOMINGO:'Paseo o zona 2 suave (113-132 lpm) si apetece. 8-10k pasos también hoy.'

function firstPending(di){
  for(const e of DAYS[di][2]) if(!exDone(e[0],week)) return e[0];
  return null;
}
function nextPending(di,afterId){ // siguiente pendiente en orden, volviendo a los saltados
  const list=DAYS[di][2], i0=list.findIndex(x=>x[0]===afterId);
  for(let k=1;k<=list.length;k++){ const e=list[(i0+k)%list.length]; if(!exDone(e[0],week)) return e[0]; }
  return null;
}

// ---- vista de día: un ejercicio a pantalla completa, desliza ↔ para cambiar ----
function exIdx(id){ return dayView===null?-1:DAYS[dayView][2].findIndex(x=>x[0]===id); }
function gotoEx(id,smooth){
  openEx=id; calEx=null;
  const pg=document.getElementById('pager');
  if(pg){ const i=Math.max(0,exIdx(id)); pg.scrollTo({left:i*pg.clientWidth, behavior:smooth?'smooth':'auto'}); }
  updateDayHud();
}
function fullDone(id){ // todas las series prescritas con reps apuntadas
  const arr=setsOf(id,week), n=prescribedSets(id,week);
  for(let i=0;i<n;i++) if(!arr[i]||arr[i].r==null) return false;
  return true;
}
function queueAdvance(id){ // al completar, pasa solo al siguiente pendiente (1,6 s de margen)
  clearTimeout(advT);
  advT=setTimeout(()=>{
    if(dayView===null||openEx!==id||!fullDone(id)) return;
    const nx=nextPending(dayView,id);
    if(nx) gotoEx(nx,true);
  },1600);
}
function updateDayHud(){ // refresca contador, barra y puntos sin re-render
  if(dayView===null) return;
  const d=DAYS[dayView], st=dayStats(dayView,week);
  const c=document.getElementById('dcount'); if(c) c.textContent=st[0]+'/'+st[1]+' ejercicios';
  const pr=document.querySelector('.dc-prog.day i'); if(pr) pr.style.width=Math.round(st[0]/st[1]*100)+'%';
  document.querySelectorAll('#pdots .pd').forEach((b,i)=>{
    const ex=d[2][i]; if(!ex) return;
    const id=ex[0], done=exDone(id,week);
    b.className='pd'+(done?' done':'')+(openEx===id?' cur':'');
    b.textContent=done?'✓':(i+1);
  });
}
function renderDay(){
  const di=dayView, d=DAYS[di], m=$('#main'), deload=week===7;
  if(openEx===null||exIdx(openEx)<0) openEx=firstPending(di)||d[2][0][0];
  const st=dayStats(di,week);
  let h='<div class="daybar"><button class="backbtn" id="backhome" title="Volver a la semana">←</button>'
    +'<div class="dbt"><b>'+d[0]+' · '+esc(d[1])+'</b>'
    +'<span>'+(deload?'S7 · Deload':'Semana '+week)+' · '+span(week)+' · <span id="dcount">'+st[0]+'/'+st[1]+' ejercicios</span></span></div></div>'
    +'<div class="dc-prog day"><i style="width:'+Math.round(st[0]/st[1]*100)+'%"></i></div>'
    +'<div class="pagerdots" id="pdots">'+d[2].map((e,i)=>'<button class="pd" data-goex="'+e[0]+'">'+(i+1)+'</button>').join('')+'</div>';
  if(deload) h+='<div class="hint" style="margin:0 0 8px">🔸 Deload: mitad de series, peso final de la semana 6. Nada de acercarse al fallo.</div>';
  h+='<div class="hint" style="margin:0 0 8px">Desliza ↔ o toca un número para cambiar de ejercicio — el orden es libre. Al apuntar todas las series pasa solo al siguiente pendiente (incluidos los saltados).</div>';
  h+='<div class="pager" id="pager">'+d[2].map(e=>'<div class="expage"><div class="excard pagecard">'+exPage(e)+'</div></div>').join('')+'</div>';
  m.innerHTML=h;
  $('#backhome').onclick=()=>{ dayView=null; openEx=null; clearTimeout(advT); window.scrollTo(0,0); clearTimeout(rt); render(); };
  m.querySelectorAll('[data-goex]').forEach(b=>b.onclick=()=>gotoEx(b.dataset.goex,true));
  const pg=$('#pager');
  pg.scrollLeft=Math.max(0,exIdx(openEx))*pg.clientWidth;
  let sT=null;
  pg.onscroll=()=>{ clearTimeout(sT); sT=setTimeout(()=>{
    if(!pg.isConnected||!pg.clientWidth) return; // pager ya desmontado (cambio de vista)
    const i=Math.max(0,Math.min(d[2].length-1,Math.round(pg.scrollLeft/pg.clientWidth)));
    if(!d[2][i]) return;
    if(openEx!==d[2][i][0]){ openEx=d[2][i][0]; updateDayHud(); }
  },90); };
  m.onpointerdown=()=>clearTimeout(advT); // interacción manual cancela el auto-avance
  wireExercise(m);
  updateDayHud();
}
function exPage(e){
  const id=e[0], done=exDone(id,week);
  const pres=prescribedSets(id,week);
  let nm=0; for(const s of setsOf(id,week)) if(marked(s)) nm++;
  return '<div class="pghead"><span class="stx'+(done?' done':nm>0?' part':'')+'">'+(done?'✓':nm+'/'+pres)+'</span>'
    +'<div class="pgt"><div class="pgname">'+esc(e[1])+(e[6]?' <span class="rampa">RAMPA</span>':'')+'</div>'
    +'<div class="pgsub">'+pres+'×'+e[3]+'-'+e[4]+' · descansa '+e[8]+'</div></div></div>'
    +exBody(e);
}
function exBody(e){
  const id=e[0], deload=week===7;
  const eng=presSets(id,week), pres=prescribedSets(id,week);
  const ovS=S.setsOver[id+'-'+week]!==undefined&&S.setsOver[id+'-'+week]!==''&&S.setsOver[id+'-'+week]!==null;
  const arr=setsOf(id,week);
  let lastM=0; arr.forEach((s,i)=>{ if(marked(s)) lastM=i+1; });
  const total=Math.min(6,Math.max(pres,lastM));
  const base=weight(id,week);
  const wk=deload?null:walk(id,week);
  const over=S.over[id+'-'+week]!==undefined&&S.over[id+'-'+week]!=='';
  let pill;
  if(deload) pill='<span class="pill none">fin de ciclo</span>';
  else if(!wk.any||base===null) pill='<span class="pill none">—</span>';
  else pill = wk.next>base ? '<span class="pill up">Próx. sem.: '+wk.next+' kg ⬆</span>'
        : wk.next<base ? '<span class="pill down">Próx. sem.: '+wk.next+' kg ⬇</span>'
        : '<span class="pill rep">Próx. sem.: '+wk.next+' kg =</span>';
  const tg=targetsFor(id,week);
  let presnote='';
  if(!deload && e[6] && week>=3 && week<=6 && RAMPOF[id] && rotPick(RAMPOF[id],week)===id){
    const r=gateReason(RAMPOF[id],week);
    if(!r) presnote='<div class="presnote up">⬆ Rampa: +1 serie esta semana (semana anterior cumplida)</div>';
    else presnote='<div class="presnote hold">Rampa en pausa: '+r+'</div>';
  }
  let rows='';
  for(let i=0;i<total;i++){
    const s=arr[i];
    const wgt = base===null?null : deload?base : (i<arr.length?wk.per[i]:wk.cur);
    const tgt = tg[i];
    const f = s&&s.e;
    rows+='<div class="setrow'+(i>=eng?' extra':'')+'">'
      +'<span class="setlbl">S'+(i+1)+' · '+(wgt===null?'—':wgt+' kg')+(tgt!==null?' <b class="tgt">→'+tgt+'</b>':'')+'</span>'
      +'<input type="number" inputmode="numeric" min="0" max="100" placeholder="'+(tgt!==null?tgt:'reps')+'" value="'+(s&&s.r!=null?s.r:'')+'" data-ex="'+id+'" data-set="'+i+'">'
      +(deload?'':'<span class="eff">'+['F','E','L','X'].map(k=>
        '<button class="s'+k+(f===k?' on':'')+'" data-eff="'+k+'" data-ex="'+id+'" data-set="'+i+'" title="'+EFFTITLE[k]+'">'+k+'</button>').join('')+'</span>')
      +'</div>';
    if(!deload && i<arr.length && wk.ev[i]){
      const after=(i+1<wk.per.length)?wk.per[i+1]:wk.cur;
      rows+='<div class="adj '+wk.ev[i]+'">'+(wk.ev[i]==='up'?'⬆ Resto de series a '+after+' kg':'⬇ Resto de series a '+after+' kg')+'</div>';
    }
  }
  let nextBtn='';
  if(exDone(id,week)){
    const nx=dayView!==null?nextPending(dayView,id):null;
    nextBtn = nx ? '<button class="btn" data-next="'+id+'" style="margin-top:12px;width:100%">✓ Hecho — siguiente: '+esc(EX[nx][1])+'</button>'
      : '<div class="hint" style="margin-top:10px">🎉 Todos los ejercicios del día completados.</div>';
  }
  return '<div class="exrow">'
    +'<button class="wchipbig'+(over?' over':'')+'" data-cal="'+id+'" title="Calibrar o ajustar el peso">'+(base===null?'¿kg? · calibrar':base+' kg · ajustar')+'</button>'
    +pill+'</div>'
    +'<div class="exmeta"><b>Hoy: '+pres+' serie'+(pres===1?'':'s')+'</b> × '+e[3]+'-'+e[4]
    +' <span class="setbtns"><button data-sminus="'+id+'">−</button><button data-splus="'+id+'">+</button></span>'
    +(ovS?' <span class="ovs">a mano (motor: '+eng+')</span>':'')
    +' · '+esc(e[7])+'</div>'
    +presnote
    +(calEx===id?calPanel(e):'')
    +rows+nextBtn+exChartCard(id);
}
// gráfica histórica del ejercicio: peso de trabajo por semana
function exChartCard(id){
  const pts=[], dataW=[];
  let any=false;
  for(let w=1;w<=7;w++){ const v=weight(id,w); pts.push(v); dataW.push(setsOf(id,w).some(marked)); if(v!=null) any=true; }
  if(!any) return '<div class="exchart"><div class="exchart-t">Progresión de peso</div><div class="hint" style="margin:2px 0 0">La gráfica aparece en cuanto calibres el peso del ejercicio (chip «¿kg? · calibrar» de arriba).</div></div>';
  const W=320,H=112,pl=12,pr=30,pt=16,pb=18;
  const vals=pts.filter(v=>v!=null);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(max-min<1){ max+=1; min=Math.max(0,min-1); }
  const X=w=>pl+(W-pl-pr)*(w-1)/6, Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  [0.25,0.75].forEach(f=>{ const y=pt+(H-pt-pb)*f; s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'; });
  const xy=[]; pts.forEach((v,i)=>{ if(v!=null) xy.push([X(i+1),Y(v),i+1,v]); });
  if(xy.length>1) s+='<polyline points="'+xy.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  xy.forEach(c=>{
    const cur=c[2]===week;
    s+='<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="'+(cur?5:3.5)+'" fill="'+(dataW[c[2]-1]?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"><title>S'+c[2]+': '+c[3]+' kg'+(dataW[c[2]-1]?'':' (previsto)')+'</title></circle>';
    if(cur) s+='<text x="'+c[0].toFixed(1)+'" y="'+(c[1]-9).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">'+c[3]+'</text>';
  });
  for(let w=1;w<=7;w++) s+='<text x="'+X(w).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" fill="'+(w===week?'var(--ink)':'var(--mut)')+'"'+(w===week?' font-weight="700"':'')+'>S'+w+'</text>';
  s+='</svg>';
  const rm=NOCALC.has(id)?null:rmAt(id,week);
  return '<div class="exchart"><div class="exchart-t">Progresión de peso</div>'+s
    +'<div class="hint" style="margin:4px 0 0">Punto relleno = semana con series apuntadas · hueco = previsión del plan.'
    +(rm!==null?' 1RM estimada: <b>'+Math.round(rm)+' kg</b>.':'')+'</div></div>';
}
// panel de calibración dentro del propio ejercicio
function calPanel(e){
  const id=e[0], k=id+'-'+week, c=S.cur[id]||['',''], r=est(id);
  let p='<div class="calpanel">';

// handlers compartidos de la ficha de ejercicio
function wireExercise(m){
  function slot(id,i){
    const k=id+'-'+week, arr=S.reps[k]||(S.reps[k]=[]);
    return arr[i]||(arr[i]={r:null,e:null});
  }
  m.querySelectorAll('.setrow input').forEach(el=>el.onchange=()=>{
    const o=slot(el.dataset.ex,+el.dataset.set);
    o.r=el.value===''?null:+el.value;
    if(o.r!=null) startRest(el.dataset.ex);
    queueAdvance(el.dataset.ex);
    save(); scheduleRender(); // diferido: no romper el tap que sigue al teclado
  });
  m.querySelectorAll('[data-eff]').forEach(b=>b.onclick=()=>{
    const o=slot(b.dataset.ex,+b.dataset.set);
    o.e=(o.e===b.dataset.eff)?null:b.dataset.eff;
    if(o.e) startRest(b.dataset.ex);
    queueAdvance(b.dataset.ex);
    save(); clearTimeout(rt); render();
  });
  m.querySelectorAll('[data-sminus],[data-splus]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.sminus||b.dataset.splus, k=id+'-'+week;
    const v=Math.max(1,Math.min(6,prescribedSets(id,week)+(b.dataset.splus?1:-1)));
    if(v===presSets(id,week)) delete S.setsOver[k]; else S.setsOver[k]=v;
    save(); clearTimeout(rt); render();
  });
  m.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.cal;
    calEx=(calEx===id)?null:id;
    clearTimeout(rt); render();
  });
  m.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{
    const nx=dayView!==null?nextPending(dayView,b.dataset.next):null;
    if(nx) gotoEx(nx,true);
  });
  m.querySelectorAll('[data-ckg],[data-crep]').forEach(el=>el.onchange=()=>{
    const id=el.dataset.ckg||el.dataset.crep;
    const kg=m.querySelector('[data-ckg="'+id+'"]').value;
    const rp=m.querySelector('[data-crep="'+id+'"]').value;
    if(kg===''&&rp==='') delete S.cur[id]; else S.cur[id]=[+kg||0,+rp||0];
    const r=est(id); if(r) S.base[id]=r[1];
    save(); scheduleRender();
  });
  m.querySelectorAll('[data-base]').forEach(el=>el.onchange=()=>{
    if(el.value==='')delete S.base[el.dataset.base]; else S.base[el.dataset.base]=+el.value;
    save(); scheduleRender();
  });
  m.querySelectorAll('[data-inc]').forEach(el=>el.onchange=()=>{
    if(el.value==='')delete S.inc[el.dataset.inc]; else S.inc[el.dataset.inc]=+el.value;
    save(); scheduleRender();
  });
  m.querySelectorAll('[data-ovr]').forEach(el=>el.onchange=()=>{
    const k=el.dataset.ovr+'-'+week;
    if(el.value.trim()==='') delete S.over[k]; else S.over[k]=+el.value;
    save(); scheduleRender();
  });
}

// ---- Progreso ----
const GROUP={l1:'Hombro',l2:'Pecho',l3:'Hombro',l4:'Tríceps',l5:'Tríceps',l6:'Abs',

GROUP.v7='Abs'; GROUP.s1='Espalda'; GROUP.s2='Espalda'; GROUP.s3='Espalda';

 l1:['Hombro',['Tríceps']], l2:['Pecho',['Hombro','Tríceps']], l3:['Hombro',[]],
 l4:['Tríceps',[]], l5:['Tríceps',[]], s5:['Bíceps',[]], l6:['Abs',[]],
 m1:['Cuádriceps',['Glúteo']], v1:['Isquios',['Glúteo']], m5:['Cuádriceps',['Glúteo']],
 m3:['Gemelo',[]], m4:['Abs',[]],
 x1:['Bíceps',[]], x2:['Bíceps',[]], x3:['Tríceps',['Pecho','Hombro']], x4:['Tríceps',[]],
 x5:['Hombro',[]], x6:['Delt. post.',['Espalda']],
 v8:['Glúteo',['Isquios','Cuádriceps']], v9:['Glúteo',['Isquios']], m6:['Cuádriceps',[]],
 v2:['Isquios',[]], v3:['Gemelo',[]], v4:['Hombro',[]], v5:['Bíceps',[]], v6:['Tríceps',[]], v7:['Abs',[]],
 s1:['Espalda',['Bíceps']], s2:['Espalda',['Bíceps','Delt. post.']], s3:['Espalda',['Bíceps']],
 s4:['Delt. post.',[]], s6:['Abs',[]]
};
const DAYL=['L','M','X','J','V','S','D'];
const fmtS=n=>(Math.round(n*10)/10).toString().replace('.',',');
function volByGroup(w){ // volumen prescrito de toda la tabla, por grupo y por día
  const g={};
  DAYS.forEach((d,di)=>{ if(!d[2])return; d[2].forEach(e=>{
    const id=e[0], n=prescribedSets(id,w), mm=MUSC[id]; if(!mm||!n) return;
    const add=(grp,val)=>{ const o=g[grp]||(g[grp]={tot:0,days:{}}); o.tot+=val; o.days[di]=(o.days[di]||0)+val; };
    add(mm[0],n); mm[1].forEach(sg=>add(sg,n*0.5));
  });});
  return g;
}
function volCard(withSel){
  const vg=volByGroup(progWeek);
  const vent=Object.entries(vg).sort((a,b)=>b[1].tot-a[1].tot);
  let h='<div class="card"><h2>Volumen semanal por grupo muscular</h2>';
  if(vent.length){
    const vmax=vent[0][1].tot;
    vent.forEach(([gn,o])=>{

      h+='<div class="gbar"><span class="glbl">'+gn+'</span><div class="gtrack"><div class="gfill" style="width:'+(o.tot/vmax*100).toFixed(0)+'%"></div><b class="gval">'+fmtS(o.tot)+'</b></div></div>'
        +'<div class="gdays">'+bd+'</div>';
    });
  }
  if(withSel){
    h+='<div class="wk-mini">';

  }

  return h;
}
let progWeek=null, progEx=null;
const fmt=n=>n.toLocaleString('es-ES');
function latestDataWeek(){
  for(let w=7;w>=1;w--) for(const e of ALLEX) if(setsOf(e[0],w).some(marked)) return w;
  return 0;
}
function setWeightFn(id,w){
  if(w===7){ const b=weight(id,7); return ()=>b; }
  const k=walk(id,w); return i=>(i<k.per.length?k.per[i]:k.cur);
}
function tonnage(w){
  let t=0;
  for(const e of ALLEX){
    const arr=setsOf(e[0],w); if(!arr.length) continue;
    const wf=setWeightFn(e[0],w);
    arr.forEach((s,i)=>{ if(s&&s.r!=null){ const x=wf(i); if(x) t+=x*s.r; } });
  }
  return Math.round(t);
}
function hardSets(w){ let n=0; for(const e of ALLEX) for(const s of setsOf(e[0],w)) if(marked(s)) n++; return n; }
function groupSets(w){
  const g={};
  for(const e of ALLEX){
    let n=0; for(const s of setsOf(e[0],w)) if(marked(s)) n++;
    if(n) g[GROUP[e[0]]]=(g[GROUP[e[0]]]||0)+n;
  }
  return g;
}
function effortDist(w){
  const c={F:0,E:0,L:0,X:0};
  for(const e of ALLEX) for(const s of setsOf(e[0],w)){ const f=effOf(s,e); if(f) c[f]++; }
  return c;
}
function sessionsDone(w){
  let d=0,t=0;
  for(let i=0;i<DAYS.length;i++){ const st=dayStats(i,w); if(st){ t++; if(st[0]===st[1]) d++; } }
  return [d,t];
}
function colChart(vals){ // tonelaje S1..S7 en línea
  const W=320,H=132,pl=12,pr=36,pt=18,pb=20;
  const pts=[]; vals.forEach((v,i)=>{ if(v>0) pts.push([i+1,v]); });
  if(!pts.length) return '';
  const vmax=Math.max(...pts.map(p=>p[1])), vmin=Math.min(...pts.map(p=>p[1]));
  const span=(vmax-vmin)||vmax||1;
  const lo=Math.max(0,vmin-span*0.2), hi=vmax+span*0.15;
  const X=w=>pl+(W-pl-pr)*(w-1)/6, Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
  [0.25,0.75].forEach(f=>{ const y=pt+(H-pt-pb)*f; s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'; });
  if(pts.length>1) s+='<polyline points="'+pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i)=>{
    s+='<g'+(p[0]===7?' opacity=".5"':'')+'><circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>Semana '+p[0]+': '+fmt(p[1])+' kg</title></circle></g>';
    if(i===pts.length-1) s+='<text x="'+X(p[0]).toFixed(1)+'" y="'+(Y(p[1])-9).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">'+fmt(p[1])+'</text>';
  });
  for(let w=1;w<=7;w++) s+='<text x="'+X(w).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" fill="var(--mut)">S'+w+'</text>';
  return s+'</svg>';
}
function sparkline(pts){ // pesos por semana de un ejercicio
  const W=84,H=30,p=5;
  if(!pts.length) return '';
  const min=Math.min(...pts), max=Math.max(...pts), r=(max-min)||1;
  const xy=pts.map((v,i)=>[p+(W-2*p)*(pts.length===1?0.5:i/(pts.length-1)), H-p-(H-2*p)*((v-min)/r)]);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="84" height="30" role="img">';
  if(pts.length>1) s+='<polyline points="'+xy.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const e=xy[xy.length-1];
  s+='<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  return s+'</svg>';

  m.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{ progWeek=+b.dataset.pw; renderProg(); });
  m.querySelectorAll('[data-pex]').forEach(b=>b.onclick=()=>{ progEx=(progEx===b.dataset.pex)?null:b.dataset.pex; renderProg(); });
}
